<head>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f6f4ef;--fg:#1e1e1e;--card:#fff;--line:#d8d3c8;--mut:#777;--acc:#2f6f4f;--red:#c0392b;--hp:#3a9d5d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181a1b;--fg:#ececec;--card:#25282a;--line:#3a3f42;--mut:#9a9a9a;--acc:#58b383;--red:#ff6b5b;--hp:#4cb872}}
:root[data-theme="dark"]{--bg:#181a1b;--fg:#ececec;--card:#25282a;--line:#3a3f42;--mut:#9a9a9a;--acc:#58b383;--red:#ff6b5b;--hp:#4cb872}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}
#app{max-width:1440px;margin:0 auto;padding:20px clamp(16px,2vw,32px)}
h1{font-size:22px;margin:4px 0 12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
button,input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.pl{margin-bottom:10px}.pl.dead{opacity:.4}.pl b.me{color:var(--acc)}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.c{width:58px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:700;padding:0}
.c.r,.chip.r{color:var(--red)}.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 3px 0 0;font-weight:700}.c.up{border-color:var(--acc)}label{font-size:14px}.c.sel{outline:3px solid var(--acc);transform:translateY(-6px)}.c:disabled,.c.disabled{opacity:0.35!important;filter:grayscale(0.7)!important;cursor:not-allowed!important;border-style:dashed!important}
.mut{color:var(--mut);font-size:14px}.log div{padding:2px 0;font-size:14px}
.code{font-size:28px;letter-spacing:6px;font-weight:700}
details summary{cursor:pointer}
.arena{background:var(--card) url(assets/bg.jpg) center/cover;border:1px solid var(--line);border-radius:16px;min-height:430px;padding:24px;margin-bottom:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 28px #00000012}
.arena .mid{display:flex;gap:clamp(20px,5vw,80px);justify-content:center;align-items:center;font-weight:800;font-size:clamp(22px,3vw,36px);margin:12px 0}
.pc{width:clamp(76px,8vw,116px);height:clamp(110px,11vw,164px);border:2px solid var(--fg);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,3vw,42px);font-weight:700;box-shadow:0 5px 14px #00000020}
.pc.r{color:var(--red)}.pc.old{opacity:.55}.pc.back{background:var(--acc);color:#fff;font-size:34px}
.arena .sides{display:flex;justify-content:space-around;align-items:flex-end;gap:24px}
.arena .side{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:clamp(16px,1.4vw,20px);max-width:46%;min-width:180px;flex:1}
.arena .side>div{background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:8px;padding:2px 8px}
.arena .side img{height:clamp(150px,18vw,250px);max-width:100%;object-fit:contain}

/* 單一整合式戰場：角色、血量與卡牌都在同一個區域 */
.battlefield{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(440px,48vw,650px);margin-bottom:16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(90deg,#1118 0%,#1112 25%,#1111 50%,#1112 75%,#1118 100%),url(assets/bg.jpg) center/cover;box-shadow:0 10px 32px #00000020;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,1.15fr) minmax(0,1fr);align-items:stretch;gap:8px;padding:18px;box-sizing:border-box}
.fighter{position:relative;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;color:#fff;text-shadow:0 2px 5px #000;z-index:1}
.fighter-art{width:100%;height:clamp(250px,30vw,410px);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 10px #0008)}
.fighter.dead .fighter-art{filter:grayscale(1) drop-shadow(0 8px 10px #0008);opacity:.48}
.fighter-info{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ffffff50;border-radius:12px;background:#111b;backdrop-filter:blur(4px)}
.fighter-info>b{font-size:clamp(16px,1.5vw,22px)}
.fighter-hp{font-size:clamp(18px,1.8vw,26px);font-weight:850;margin:3px 0}
.fighter .bar{height:12px;background:#ffffff45}.fighter .bar i{background:#55d87b}
.fighter-cards{margin-top:6px;overflow-wrap:anywhere}.fighter-cards .chip{background:#fff;color:#222;text-shadow:none;margin-bottom:3px}
.fighter-cards .chip.r{color:#c0392b}
.battle-core{position:relative;z-index:2;align-self:center;min-width:0;padding:clamp(12px,2vw,24px);border:1px solid #ffffff65;border-radius:18px;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 8px 28px #0004;backdrop-filter:blur(5px)}
.battle-heading{text-align:center;font-size:18px;font-weight:850;letter-spacing:2px}
.battle-mid{display:flex;gap:clamp(8px,1.5vw,24px);justify-content:center;align-items:center;margin:20px 0}
.battle-hint{text-align:center;color:var(--mut);font-size:13px}
.battlefield .pc{width:clamp(66px,6.5vw,100px);height:clamp(96px,10vw,145px);font-size:clamp(25px,2.6vw,38px)}
.battlefield .versus{font-size:clamp(20px,2.3vw,34px)}
.players-summary-hidden{display:none}
.play-panel{position:relative}
@media(min-width:1000px){#app{padding-top:24px}#app>h1{font-size:30px;margin-bottom:18px}#app>.box{padding:20px}.hand{gap:14px;justify-content:center}.c{width:82px;height:120px;font-size:32px;border-radius:12px}.play-panel{position:sticky;bottom:0;z-index:4;box-shadow:0 -6px 24px #00000010}.log div{font-size:15px;padding:4px 0}}
@media(max-width:850px){.battlefield{min-height:430px;grid-template-columns:minmax(0,1fr) minmax(180px,1.1fr) minmax(0,1fr);padding:10px;gap:4px}.fighter-art{height:clamp(170px,28vw,260px)}.fighter-info{padding:7px 5px}.fighter-info>b{font-size:14px}.fighter-hp{font-size:17px}.fighter .bar{height:8px}.battle-core{padding:10px 6px}.battlefield .pc{width:48px;height:70px;font-size:20px}.battle-mid{gap:5px;margin:12px 0}}
@media(max-width:560px){.battlefield{min-height:380px;grid-template-columns:minmax(0,1fr) minmax(115px,.85fr) minmax(0,1fr);padding:7px;gap:2px;border-radius:12px}.fighter-art{height:clamp(135px,32vw,190px)}.fighter-info{padding:6px 3px}.fighter-info>b{font-size:12px}.fighter-cards .chip{font-size:11px;padding:0 3px;margin:1px}.battle-core{padding:8px 3px;border-radius:10px}.battle-heading{font-size:13px;letter-spacing:0}.battle-hint{font-size:11px}.battlefield .pc{width:35px;height:54px;font-size:16px;border-radius:6px}.battlefield .versus{font-size:16px}.battle-mid{gap:3px;margin:10px 0}.fighter .mut{font-size:10px}}
.battlefield{min-height:0!important;margin-bottom:10px;padding:12px!important}
.fighter-art{height:clamp(140px,27vh,320px)!important}
.battlefield .battle-mid{margin:8px 0!important}
.battle-core .hand{gap:6px;justify-content:center}
.battle-core .c{width:44px;height:64px;font-size:17px;border-radius:8px;gap:0}
.battle-core .c.sel{transform:translateY(-5px)}
.battle-core button{padding:5px 14px}
.act{margin-top:8px;text-align:center;font-size:14px}.act .row{margin:6px 0 0}
.mini-log{font-size:12px;color:var(--mut);margin-top:6px;text-align:center;line-height:1.35}
details.box summary{cursor:pointer}
.c.cmd,.chip.cmd{box-shadow:0 0 0 3px #7fc8ff;border-color:#7fc8ff}
.art-wrap{position:relative;display:flex;justify-content:center;align-items:flex-end}
.art-wrap.v3.left{padding-left:70px}.art-wrap.v3.right{padding-right:70px}
.resv{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;z-index:0}
.resv.left{left:0}.resv.right{right:0}
.art-wrap .fighter-art{position:relative;z-index:1}
.rchip{width:64px;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden;cursor:grab}
.rchip img{width:62px;height:56px;object-fit:cover;display:block}
.rchip.dead{opacity:.35;filter:grayscale(1);cursor:default}.rchip.pend{outline:3px solid #7fc8ff}
.pc.glow{box-shadow:0 0 14px 5px gold;border-color:gold}
.bar i[data-bar]{transition:none}
.fighter .cpbar{height:7px;margin-top:4px;background:#ffffff35}.fighter .cpbar i{background:#b8f03a}
.cpt{font-size:12px;color:#d6f78a;margin-top:3px}
.fighter-art[onclick]{cursor:pointer}
.rchip.nutc{border-color:#8bc34a}

/* ==========================
   VISUAL REDESIGN LAYER
   Appearance and motion only — gameplay JavaScript is unchanged.
   ========================== */
:root {
  color-scheme: dark;
  --bg: #080d15;
  --fg: #f1ecdf;
  --card: #121b28;
  --line: #354459;
  --mut: #a3b0c1;
  --acc: #d3aa61;
  --red: #ff7785;
  --hp: #55d99b;
  --gold-soft: #f3d49a;
  --panel: rgba(15, 24, 37, .92);
  --panel-deep: rgba(8, 14, 23, .94);
  --shadow-lg: 0 24px 70px rgba(0,0,0,.38);
  box-sizing: border-box;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eee8dc;
  --fg: #1b2632;
  --card: #fffaf0;
  --line: #d2c4aa;
  --mut: #6e7781;
  --acc: #8b622a;
  --red: #bd354b;
  --hp: #26895d;
  --panel: rgba(255, 251, 242, .96);
  --panel-deep: rgba(246, 239, 225, .97);
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100vh;
  color: var(--fg);
  background:
    radial-gradient(ellipse at 50% -12%, rgba(68, 103, 143, .25), transparent 48%),
    radial-gradient(ellipse at 4% 48%, rgba(170, 123, 53, .09), transparent 33%),
    radial-gradient(ellipse at 100% 82%, rgba(38, 91, 88, .12), transparent 34%),
    linear-gradient(145deg, #080d15 0%, #0b1320 52%, #080d15 100%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", sans-serif;
  letter-spacing: .01em;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .18;
  background-image: radial-gradient(rgba(239,222,187,.5) .6px, transparent .7px);
  background-size: 27px 27px;
  mask-image: linear-gradient(to bottom, black, transparent 92%);
}
#app {
  max-width: 1500px;
  margin: 0 auto;
  padding: 16px clamp(14px, 2.5vw, 38px) 48px;
}
#aud {
  position: relative;
  z-index: 20;
  max-width: 1500px !important;
  margin: 0 auto !important;
  padding: 14px clamp(14px, 2.5vw, 38px) 4px !important;
  justify-content: flex-end;
  gap: 9px;
}
#aud::before {
  content: "DUEL 25  /  AUDIO";
  margin-right: auto;
  align-self: center;
  color: #8999ad;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .2em;
}
#aud button {
  padding: 7px 13px;
  border-radius: 999px;
  border-color: rgba(199, 174, 126, .27);
  background: rgba(17, 27, 41, .72);
  color: #e5d7bc;
  font-size: 12px;
  backdrop-filter: blur(12px);
}
#aud input[type="range"] { accent-color: var(--acc); }
#app > h1 {
  position: relative;
  margin: 16px auto 30px;
  padding: 14px 10px 24px;
  text-align: center;
  font-family: Georgia, "Noto Serif TC", serif;
  font-size: clamp(32px, 5vw, 58px);
  line-height: 1.22;
  font-weight: 900;
  letter-spacing: .12em;
  color: transparent;
  background: linear-gradient(110deg, #fff0c6 6%, #d0a254 33%, #fff0c6 51%, #b78742 75%, #f4dba7 96%);
  background-clip: text;
  -webkit-background-clip: text;
  filter: drop-shadow(0 5px 18px rgba(212, 168, 86, .16));
}
#app > h1::before {
  content: "THE ART OF THE DUEL";
  display: block;
  margin-bottom: 11px;
  color: #8293a9;
  font: 800 10px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .42em;
}
#app > h1::after {
  content: "♠   STRATEGY  ·  FATE  ·  VICTORY   ♦";
  display: block;
  margin-top: 15px;
  color: #a9b4c3;
  font: 700 10px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .24em;
}
h1 { color: var(--fg); }
.box {
  position: relative;
  margin-bottom: 16px;
  padding: clamp(16px, 2vw, 25px);
  border: 1px solid rgba(191, 164, 112, .22);
  border-radius: 18px;
  color: var(--fg);
  background: linear-gradient(145deg, rgba(20, 31, 47, .94), rgba(11, 18, 29, .96));
  box-shadow: 0 12px 34px rgba(0,0,0,.17), inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter: blur(14px);
}
#app > h1 + .box {
  max-width: 980px;
  margin: 0 auto 24px;
  padding: clamp(22px, 4vw, 42px);
  overflow: hidden;
  border-radius: 24px;
  border-color: rgba(211, 170, 97, .38);
  background:
    radial-gradient(ellipse at 100% 0%, rgba(179, 132, 59, .15), transparent 38%),
    radial-gradient(ellipse at 0% 100%, rgba(51, 109, 125, .13), transparent 40%),
    linear-gradient(145deg, rgba(19, 30, 46, .97), rgba(9, 16, 26, .98));
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.06);
}
#app > h1 + .box::after {
  content: "♠  ♦  ♣  ♥";
  position: absolute;
  right: 24px;
  top: 15px;
  color: rgba(212, 170, 96, .18);
  font: 900 24px/1 Georgia, serif;
  letter-spacing: .2em;
  pointer-events: none;
}
#app > h1 + .box > b {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0 8px;
  color: #e8d2a8;
  font-size: 14px;
  font-weight: 850;
  letter-spacing: .08em;
}
#app > h1 + .box > b::before {
  content: "";
  width: 20px;
  height: 1px;
  background: linear-gradient(90deg, var(--acc), transparent);
}
.row {
  gap: 10px;
  margin: 12px 0;
}
#app label {
  color: #c5ced9;
  font-size: 13px;
  font-weight: 650;
}
#app > h1 + .box .row > label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  border: 1px solid rgba(139, 162, 186, .16);
  border-radius: 11px;
  background: rgba(255,255,255,.025);
}
input, select, button {
  font-family: inherit;
}
input:not([type="checkbox"]):not([type="range"]), select {
  min-height: 39px;
  color: var(--fg);
  border: 1px solid #35465d;
  border-radius: 10px;
  outline: none;
  background-color: #0c1522;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.2);
  transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
input::placeholder { color: #73839a; }
input:focus, select:focus {
  border-color: rgba(211, 170, 97, .85) !important;
  box-shadow: 0 0 0 3px rgba(211, 170, 97, .12), inset 0 1px 2px rgba(0,0,0,.2) !important;
}
input[type="checkbox"] { accent-color: var(--acc); width: 16px; height: 16px; }
button {
  min-height: 38px;
  border: 1px solid #405069;
  border-radius: 10px;
  padding: 8px 14px;
  color: #e7edf5;
  background: linear-gradient(180deg, #1a293c, #121e2d);
  box-shadow: 0 3px 9px rgba(0,0,0,.13), inset 0 1px 0 rgba(255,255,255,.06);
  font-weight: 750;
  transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease, filter .16s ease;
}
button:hover:not(:disabled) {
  transform: translateY(-2px);
  border-color: rgba(219, 184, 119, .72);
  filter: brightness(1.11);
  box-shadow: 0 7px 18px rgba(0,0,0,.24), 0 0 0 1px rgba(211,170,97,.08);
}
button:active:not(:disabled) { transform: translateY(0) scale(.985); }
button.pri {
  color: #1a1a18;
  border-color: #e4bf79;
  background: linear-gradient(135deg, #f3d79e, #c7984b 58%, #ebc982);
  box-shadow: 0 5px 18px rgba(193, 143, 60, .2), inset 0 1px 0 rgba(255,255,255,.55);
  text-shadow: 0 1px 0 rgba(255,255,255,.2);
}
button.pri:hover:not(:disabled) {
  border-color: #ffedc7;
  box-shadow: 0 8px 24px rgba(193, 143, 60, .28), 0 0 18px rgba(228, 191, 121, .14);
}
button:disabled { opacity: .36; filter: saturate(.4); box-shadow: none; }
hr { opacity: .8; }
.mut { color: var(--mut); }
.code {
  color: #f0d49e;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  text-shadow: 0 0 18px rgba(211,170,97,.18);
}
details.box { padding: 0; overflow: hidden; }
details.box > summary {
  position: relative;
  padding: 17px 21px;
  color: #e8d2a8;
  font-weight: 850;
  letter-spacing: .04em;
  list-style: none;
  cursor: pointer;
}
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::after {
  content: "+";
  float: right;
  color: var(--acc);
  font-size: 20px;
  line-height: 1;
  transition: transform .2s ease;
}
details[open].box > summary::after { content: "−"; }
details.box > summary + div { padding: 0 21px 21px; }

/* Arena / combat presentation */
.battlefield {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 500px;
  padding: clamp(12px, 2vw, 24px) !important;
  border: 1px solid rgba(210, 174, 105, .43);
  border-radius: 23px;
  background-color: #09111c;
  background-image:
    radial-gradient(ellipse at 50% 48%, rgba(143, 112, 59, .19), transparent 32%),
    linear-gradient(90deg, rgba(4,9,16,.86) 0%, rgba(7,14,24,.42) 28%, rgba(7,14,24,.22) 50%, rgba(7,14,24,.42) 72%, rgba(4,9,16,.86) 100%),
    url(assets/bg.jpg);
  background-position: center, center, center;
  background-size: cover;
  box-shadow: 0 20px 55px rgba(0,0,0,.32), inset 0 0 75px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
}
.battlefield::before {
  content: "";
  position: absolute;
  z-index: 0;
  inset: 0;
  pointer-events: none;
  opacity: .48;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 19%, rgba(228,190,117,.07) 19.1% 19.25%, transparent 19.4% 28%, rgba(228,190,117,.045) 28.1% 28.2%, transparent 28.4%),
    repeating-linear-gradient(0deg, transparent 0 47px, rgba(220,196,150,.035) 48px, transparent 49px),
    repeating-linear-gradient(90deg, transparent 0 47px, rgba(220,196,150,.035) 48px, transparent 49px);
  animation: arenaAura 14s ease-in-out infinite alternate;
}
.battlefield::after {
  content: "DUEL ARENA  •  ROUND IN PROGRESS";
  position: absolute;
  z-index: 0;
  left: 50%;
  top: 8px;
  transform: translateX(-50%);
  padding: 3px 13px 5px;
  border-bottom: 1px solid rgba(217,180,112,.3);
  color: rgba(228,205,160,.53);
  font-size: 9px;
  font-weight: 850;
  letter-spacing: .24em;
  white-space: nowrap;
  pointer-events: none;
}
.fighter {
  color: #f6efe2;
  text-shadow: 0 2px 7px #000, 0 0 18px rgba(0,0,0,.45);
}
.fighter-art {
  filter: drop-shadow(0 12px 14px rgba(0,0,0,.62)) drop-shadow(0 0 17px rgba(204,165,94,.08));
  transform-origin: 50% 100%;
  transition: filter .35s ease, opacity .35s ease;
}
.fighter.dead .fighter-art {
  filter: grayscale(1) brightness(.62) drop-shadow(0 8px 10px #0008);
}
.fighter-info {
  border: 1px solid rgba(220,190,132,.28);
  border-radius: 15px;
  background: linear-gradient(145deg, rgba(13,22,34,.93), rgba(6,12,20,.92));
  box-shadow: 0 11px 25px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.045);
  backdrop-filter: blur(12px);
}

/* 3v3 角色選角：大圖卡與清楚的隊伍摘要 */
.draft-box{padding:clamp(14px,2.2vw,26px)}
.draft-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.draft-title{font-size:clamp(20px,2.5vw,28px);font-weight:850;line-height:1.2}
.draft-turn{padding:7px 12px;border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--acc) 13%,var(--card));font-weight:750}
.draft-order{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.draft-teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 20px}
.draft-team{min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--card) 90%,var(--bg))}
.draft-team.active{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 20%,transparent)}
.draft-team-name{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800;margin-bottom:9px}
.draft-team-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.draft-pick{min-width:0;min-height:82px;display:flex;align-items:center;gap:7px;padding:6px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.draft-pick img{width:44px;height:66px;flex:0 0 44px;object-fit:contain;filter:drop-shadow(0 3px 4px #0006)}
.draft-pick-name{min-width:0;font-size:12px;font-weight:750;line-height:1.3;overflow-wrap:anywhere}
.draft-pick-role{display:block;margin-top:4px;color:var(--mut);font-size:11px;font-weight:500}
.draft-empty{grid-column:1/-1;padding:13px;border:1px dashed var(--line);border-radius:9px;color:var(--mut);text-align:center}
.draft-section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0;font-weight:800}
.draft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.draft-option{position:relative;min-width:0;min-height:0!important;display:flex;flex-direction:column;align-items:stretch;overflow:hidden;padding:0!important;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);text-align:left;transition:transform .16s,border-color .16s,box-shadow .16s,opacity .16s}
.draft-option:not(:disabled):hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 8px 22px #0004}
.draft-option:disabled{opacity:.76;cursor:default}
.draft-option.picked{opacity:.42;filter:saturate(.65)}
.draft-art{height:154px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--acc) 24%,transparent),transparent 72%),linear-gradient(180deg,color-mix(in srgb,var(--bg) 30%,transparent),var(--bg))}
.draft-art img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 5px 8px #0007)}
.draft-card-info{padding:9px 10px 10px}

.draft-card-tag{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.draft-badge{padding:2px 6px;border-radius:999px;background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--fg);font-size:10px;font-weight:700}
.draft-desc{display:-webkit-box;min-height:3.9em;margin-top:7px;overflow:hidden;color:var(--mut);font-size:11px;line-height:1.3;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.draft-picked-label{position:absolute;top:8px;right:8px;padding:4px 7px;border-radius:999px;background:#161b21e8;color:#fff;font-size:11px;font-weight:800}
@media(max-width:700px){.draft-teams{grid-template-columns:1fr}.draft-team-slots{grid-template-columns:repeat(3,minmax(0,1fr))}.draft-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.draft-art{height:clamp(104px,32vw,145px)}.draft-card-info{padding:8px}.draft-card-name{font-size:14px}.draft-desc{font-size:10px;min-height:3.9em}}
@media(max-width:380px){.draft-grid{grid-template-columns:1fr}.draft-option{display:grid;grid-template-columns:94px minmax(0,1fr);align-items:stretch}.draft-art{height:100%;min-height:125px}.draft-card-info{align-self:center}.draft-desc{min-height:0}}

/* ========================================================
   二十五之刻 垂直計量表 & 完美決鬥 / 25絕技 UI
   ======================================================== */
.fighter{position:relative;}
.clock25-container{
  position:absolute;
  top:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:32px;
  height:clamp(160px,26vw,260px);
  z-index:10;
  pointer-events:auto;
  user-select:none;
}
.clock25-container.left{left:4px;}
.clock25-container.right{right:4px;}
.clock25-header{
  font-size:9px;
  font-weight:900;
  writing-mode:vertical-rl;
  letter-spacing:2px;
  color:#f3d49a;
  text-shadow:0 1px 4px #000;
  margin-bottom:4px;
}
.clock25-track{
  position:relative;
  width:14px;
  flex:1;
  background:rgba(8,14,24,0.85);
  border:1.5px solid rgba(212,175,55,0.45);
  border-radius:999px;
  overflow:hidden;
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.8),0 0 8px rgba(0,0,0,0.4);
}
.clock25-fill{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:linear-gradient(to top,#1e824c,#2ecc71,#f1c40f);
  box-shadow:0 0 10px rgba(241,196,15,0.7);
  transition:height 0.4s cubic-bezier(0.4,0,0.2,1);
  border-radius:0 0 999px 999px;
}
.clock25-markers{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:4px 0;
  pointer-events:none;
  box-sizing:border-box;
}
.clock25-markers span{
  font-size:7px;
  line-height:1;
  color:rgba(255,255,255,0.4);
  text-align:center;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-weight:700;
}
.clock25-badge{
  margin-top:4px;
  font-size:10px;
  font-weight:850;
  padding:1px 4px;
  border-radius:6px;
  background:#0c1522;
  border:1px solid rgba(212,175,55,0.4);
  color:#f1ecdf;
  white-space:nowrap;
  box-shadow:0 2px 5px rgba(0,0,0,0.5);
}

/* 完美狀態 (25點) */
.clock25-container.ready .clock25-track{
  border-color:#ffd700;
  box-shadow:0 0 18px rgba(255,215,0,0.85),inset 0 0 8px rgba(255,215,0,0.6);
  animation:clockReadyPulse 1.2s infinite alternate ease-in-out;
}
.clock25-container.ready .clock25-fill{
  background:linear-gradient(to top,#b8860b,#ffd700,#fff5b8);
  box-shadow:0 0 16px #ffd700;
}
.clock25-container.ready .clock25-badge{
  background:linear-gradient(135deg,#ffd700,#b8860b);
  color:#000;
  font-weight:900;
  border-color:#fff;
  box-shadow:0 0 10px rgba(255,215,0,0.8);
}
@keyframes clockReadyPulse{
  from{filter:brightness(1) drop-shadow(0 0 4px #ffd700);}
  to{filter:brightness(1.35) drop-shadow(0 0 14px #ffd700);}
}

/* 爆牌崩壞狀態 (>25點) */
.clock25-container.bust .clock25-track{
  border-color:#ff5e5e;
  background:rgba(35,8,8,0.9);
  box-shadow:inset 0 0 8px rgba(231,76,60,0.6);
}
.clock25-container.bust .clock25-fill{
  background:linear-gradient(to top,#581212,#991b1b);
  opacity:0.65;
}
.clock25-container.bust .clock25-header{
  color:#ff7777;
}
.clock25-container.bust .clock25-badge{
  background:#7f1d1d;
  color:#ffcdd2;
  border-color:#ef4444;
}

/* 已發動過 / 鎖定狀態 */
.clock25-container.used .clock25-fill{filter:grayscale(0.6);opacity:0.5;}
.clock25-container.locked{opacity:0.55;filter:grayscale(0.4);}

/* 完美決鬥全螢幕大字橫幅 */
.perfect-duel-modal{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(4,8,16,0.85);
  backdrop-filter:blur(10px);
  animation:pdFadeIn 0.35s ease-out;
  cursor:pointer;
}
.pd-content{
  position:relative;

.damage-pop.healing{color:#a5f0c7;text-shadow:0 2px 0 #164535,0 3px 7px #000,0 0 12px #285d47}
.healing-pulse{position:absolute;transform:translate(-50%,-50%);color:#a0efca;--heal-delay:0ms}
.healing-pulse>*{position:absolute;animation-delay:var(--heal-delay)!important}
.healing-bloom{inset:5%;border-radius:50%;background:radial-gradient(ellipse,#b7ffdf44,#78d8b329 35%,transparent 72%);opacity:0;animation:healingBloom 950ms ease-out both}
.healing-wave{inset:15% 11%;border:1px solid #acf0d0a8;border-radius:50%;box-shadow:0 0 10px #92d9b838;opacity:0;animation:healingWave 850ms ease-out both}
.healing-wave.second{inset:25% 20%;animation-delay:calc(var(--heal-delay) + 120ms)!important}
.healing-heart{left:44%;top:41%;width:12%;height:12%;opacity:0;animation:healingHeart 850ms ease-out both}
.healing-heart::before,.healing-heart::after,.healing-spark::before,.healing-spark::after{content:'';position:absolute;background:currentColor;border-radius:2px;box-shadow:0 0 7px #b1ffe17a}
.healing-heart::before,.healing-spark::before{left:0;top:40%;width:100%;height:20%}.healing-heart::after,.healing-spark::after{left:40%;top:0;width:20%;height:100%}
.healing-spark{left:var(--heal-x);top:var(--heal-y);width:6px;height:6px;opacity:0;animation:healingSpark 850ms ease-out both;animation-delay:calc(var(--heal-delay) + var(--heal-spark-delay))!important}
.healing-pulse.compact .healing-spark{width:4px;height:4px}.healing-pulse.drain .healing-bloom{background:radial-gradient(ellipse,#9be0bb3b,#be878f1a 48%,transparent 72%)}
@keyframes healingBloom{0%{opacity:0;transform:scale(.6)}20%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
@keyframes healingWave{0%{opacity:0;transform:scale(.45)}20%{opacity:.55}100%{opacity:0;transform:scale(1.25)}}
@keyframes healingHeart{0%{opacity:0;transform:translateY(12px) scale(.5)}22%{opacity:.6;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-20px) scale(.8)}}
@keyframes healingSpark{0%{opacity:0;transform:translateY(10px) scale(.5)}25%{opacity:.7}100%{opacity:0;transform:translate(var(--heal-drift),calc(-1 * var(--heal-rise))) scale(.4)}}
@media(max-width:650px){.healing-wave{box-shadow:none}.healing-spark{width:5px;height:5px}.damage-pop.healing small{font-size:10px}}
@media(prefers-reduced-motion:reduce){.healing-spark,.healing-heart,.healing-wave.second{display:none}.healing-pulse>*{animation:healingQuiet 950ms linear both!important;animation-delay:var(--heal-delay)!important;box-shadow:none}@keyframes healingQuiet{0%,100%{opacity:0}15%,70%{opacity:.3}}}
/* 李箱鏡世界選擇：完整清單可捲動，手機使用單欄。 */
.mirror-modal{background:#081015eb;padding:18px;z-index:10020}
.mirror-content{box-sizing:border-box;width:min(820px,100%);max-height:calc(100dvh - 36px);overflow:auto;border:1px solid #819ca5;border-radius:12px;padding:24px;background:linear-gradient(145deg,#223440,#101d27);color:#edf4f3;box-shadow:0 18px 75px #0009;text-align:left}
.mirror-heading{display:flex;gap:20px;align-items:center}.mirror-heading img{width:100px;height:125px;object-fit:contain}.mirror-heading small{color:#9bbbc5}.mirror-heading h2{font-size:28px;margin:5px 0 10px}.mirror-heading p,.mirror-note{color:#bfd0d4;font-size:13px;line-height:1.6}
.mirror-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.mirror-option{display:flex;flex-direction:column;gap:10px;text-align:left;white-space:normal;padding:16px;border:1px solid #597d8b;border-radius:8px;background:#192c39;color:#e9f4f5;min-height:128px}.mirror-option b{font-size:17px}.mirror-option span{font-size:12px;line-height:1.7;color:#b7ced5}.mirror-option:hover:not(:disabled){border-color:#b4e3ec;background:#244353}.mirror-option:disabled{opacity:.65;cursor:default}.mirror-note{margin:18px 0 0}
@media(max-width:650px){.mirror-modal{padding:10px}.mirror-content{padding:16px;max-height:calc(100dvh - 20px)}.mirror-heading{gap:12px}.mirror-heading img{width:64px;height:88px}.mirror-heading h2{font-size:24px}.mirror-options{grid-template-columns:1fr;gap:10px}.mirror-option{min-height:110px}}
.moses-breaths{width:100%;padding:12px;border:1px solid #607b73;border-radius:6px;background:#172521;box-sizing:border-box}.moses-smoke{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.moses-smoke span{padding:4px 7px;border-radius:4px;background:#ffffff0b;font-size:12px}.moses-smoke [data-smoke="red"]{color:#e7a39a}.moses-smoke [data-smoke="purple"]{color:#c3a9e9}.moses-smoke [data-smoke="white"]{color:#eee9de}.moses-smoke [data-smoke="crimson"]{color:#ff7777}.moses-breaths .row{margin:0;gap:7px}.moses-breaths button{font-size:12px;white-space:normal}.moses-breaths .mut{display:block;margin-top:7px}

.bar.tkt-bar{position:relative}.tkt-bar .tkt-divider{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#101914;pointer-events:none;z-index:1}
.time-death-clock{margin:8px 0;padding:7px 9px;border:1px solid #a16e63;border-radius:5px;color:#ffb5a4;background:#40252180;font:650 12px/1.5 system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media(max-width:650px){.time-death-clock{padding:5px 6px;font-size:10px}}

<body>
<div id="aud" class="row"><div class="audio-control"><button id="b1" onclick="toggleBgm()">🎵 BGM：關</button><label for="bgmVolume" class="audio-label">音樂音量</label><input id="bgmVolume" type="range" min="0" max="100" value="65" oninput="setBgmVol(this.value)"><output id="bgmVolumeValue" for="bgmVolume">65%</output></div><div class="audio-control"><button id="b2" onclick="toggleSfx()">🔊 音效：開</button><label for="sfxVolume" class="audio-label">音效音量</label><input id="sfxVolume" type="range" min="0" max="100" value="80" oninput="setSfxVol(this.value)"><output id="sfxVolumeValue" for="sfxVolume">80%</output></div></div>
<div id="app"><div class="box">載入中…</div></div>
<script>
const SU={S:'♠',C:'♣',H:'♥',D:'♦'},RED={H:1,D:1};
const NM=r=>({1:'A',11:'J',12:'Q',13:'K'}[r]||r);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cs=c=>SU[c[0]]+NM(+c.slice(1));
let db,uid,code=null,room=null,joins=[],moves={},unsubs=[],sel=null,myName='';
try{myName=localStorage.getItem('d25name')||''}catch(e){}

const CHARS={yoshi:{n:'良秀',t:'天殺星',d:'主動技【天殺】（冷卻1回合，手牌≥2張時可用）：本回合出牌視為特殊攻擊，傷害等於該牌點數，對手的牌效果全部無效（對手出方塊則不受傷害也無法反擊）。攻擊命中（對手沒出方塊）才會永久刪除對手該牌的卡牌槽（明/暗槽對應）；自己無論是否命中都失去此次使用的卡牌槽（持有【血缘】則不消除自己的卡牌槽）。優先於一切效果。25絕技：【天殺-斷】（消除除自己外全體3張手牌，優先明牌）、【血缘【けつえん】】（手牌補滿上限，天殺不再消除自己的卡牌）。',
  d25Skills:[
    {id:1,name:'天殺-斷',type:'進攻型',desc:'將除自己以外所有玩家的手牌消除3張（優先明牌，最低保留1張）',
      instantFx:(r,i,o)=>{
        const msgs=[];
        r.seats.forEach((seat,sIdx)=>{
          if(sIdx===i)return;
          if(!r.hands[sIdx]||r.hands[sIdx].length<=1){
            msgs.push(`${seat.name} 手牌僅剩 ${r.hands[sIdx]?r.hands[sIdx].length:0} 張，無法消除`);
            return;
          }
          const canRemove=Math.min(3,r.hands[sIdx].length-1);
          const removed=[];
          for(let k=0;k<canRemove;k++){
            const upCand=r.hands[sIdx].find(c=>r.up[sIdx]&&r.up[sIdx].includes(c));
            const card=upCand||r.hands[sIdx][0];
            r.hands[sIdx]=r.hands[sIdx].filter((c,idx)=>c!==card||idx!==r.hands[sIdx].indexOf(card));
            if(r.up[sIdx])r.up[sIdx]=r.up[sIdx].filter((c,idx)=>c!==card||idx!==r.up[sIdx].indexOf(card));
            removed.push(cs(card));
          }
          while(r.up[sIdx]&&r.oc[sIdx]&&r.up[sIdx].length<Math.min(r.oc[sIdx],r.hands[sIdx].length)){
            const hid=r.hands[sIdx].find(c=>!r.up[sIdx].includes(c));
            if(hid)r.up[sIdx].push(hid);else break;
          }
          if(typeof moves!=='undefined'&&moves[r.round+'_'+sIdx]){
            try{db.doc(`rooms/${code}/moves/${r.round}_${sIdx}`).set(null)}catch(e){}
          }
          msgs.push(`${seat.name} 失去 ${canRemove} 張手牌（${removed.join('、')}，剩 ${r.hands[sIdx].length} 張）`);
        });
        return `【天殺-斷】斬裂全場！`+msgs.join('；');
      }
    },
    {id:2,name:'血缘【けつえん】',type:'輔助型',desc:'獲得被動血缘，手牌補至上限，且天殺不再消除自己的卡牌',
      instantFx:(r,i,o)=>{
        r.st[i].ketsuen=1;
        const targetCount=r.cfg.hand||5;
        const curCount=r.hands[i]?r.hands[i].length:0;
        const need=Math.max(0,targetCount-curCount);
        let drawn=[];
        if(need>0){
          if(!r.deck||r.deck.length<need){
            const allOtherCards=Object.values(r.hands).flat();
            r.deck=newDeck(allOtherCards);
          }
          drawn=r.deck.splice(0,need);
          r.hands[i]=[...(r.hands[i]||[]),...drawn];
        }
        if(r.oc[i]<(r.cfg.open||0))r.oc[i]=r.cfg.open;
        while(r.up[i]&&r.oc[i]&&r.up[i].length<Math.min(r.oc[i],r.hands[i].length)){
          const hid=r.hands[i].find(c=>!r.up[i].includes(c));
          if(hid)r.up[i].push(hid);else break;
        }
        return `獲得被動【血缘【けつえん】】！手牌補滿至 ${targetCount} 張（補充 ${need} 張），此後天殺不再消除自身卡牌！`;
      }
    }
  ]}};
CHARS.umb={n:'傘神',t:'',d:'被動：每次受到攻擊疊加1層神罰，滿3層進入【神怒】（你的攻擊被方塊反擊成功時也會疊1層），持續2場自己參與的戰鬥（旁觀回合不扣）：出牌點數皆以K（13）計算；結束後神罰歸零重新累積。25絕技：【神雷】（全場敵人含後備獲得2回合麻痺，最終出牌點數固定為1）、【神滅】（自身獲得2回合神滅，最終出牌點數固定為24）。麻痺與神滅在角色參與戰鬥後扣除回合數，旁觀與後備期間不扣；兩者同時存在時麻痺優先。',
  d25Skills:[
    {id:1,name:'神雷',type:'進攻型',desc:'使全場敵人（含後備）獲得2回合麻痺，任何牌的最終點數固定為1；旁觀與後備期間不扣回合',
      instantFx:(r,i,o)=>{
        r.seats.forEach((_,j)=>{if(j===i||(r.cfg.boss&&(i===1?j===1:j!==1)))return;
          if(r.hp[j]>0)r.st[j].paralysis=Math.max(r.st[j].paralysis||0,2);
          if(r.team)r.team[j].forEach((m,k)=>{if(k!==r.act[j]&&!m.dead&&m.hp>0)m.st.paralysis=Math.max(m.st.paralysis||0,2)});
        });
        return '全場敵人（含後備）獲得【麻痺】2回合，任何牌的最終點數固定為1；旁觀與後備期間不扣回合！';
      }},
    {id:2,name:'神滅',type:'輔助型',desc:'自身獲得2回合神滅，任何牌的最終點數固定為24；旁觀與後備期間不扣回合，麻痺優先',
      instantFx:(r,i,o)=>{r.st[i].divineAnnihilation=Math.max(r.st[i].divineAnnihilation||0,2);return '獲得【神滅】2回合，任何牌的最終點數固定為24；旁觀與後備期間不扣回合！';}}
  ]};
CHARS.val={n:'瓦倫希娜',t:'',d:'擁有6層預知眼。與你同時出攻擊牌（♠/♣）時拼點：你的點數＋預知眼層數，點大者才能攻擊，平手算你贏，輸的一方攻擊無效。拼點成功：預知眼-1並獲得1層巴勒莫劍術（等效1層強壯：出牌點數永久+1，可疊加，可超過13點）。被攻擊命中時預知眼-2。預知眼歸零後進入過熱3層：不再拼點，並獲得2層虛弱（出牌點數-2）；每場自己參與的戰鬥-1層，歸零時恢復6層預知眼。優先級低於天殺。25絕技：【處置】（黑牌點數+5*巴勒莫層數與敵方黑牌拼點，勝時銷毀對方黑牌槽並造成1*5單方面攻擊）、【心-瓦倫希娜】（預知眼不再過熱，且每回合結束回復1層預知眼）。',
  d25Skills:[
    {id:1,name:'處置',type:'進攻型',desc:'黑牌點數+5*巴勒莫層數與敵方黑牌拼點，勝時銷毀對方黑牌槽並造成1*5單方面攻擊',
      instantFx:(r,i,o)=>{
        const msgs=[],damage=[];
        const myHand=r.hands[i]||[];
        let landed=false;
        const myBlackCards=myHand.filter(c=>'SC'.includes(c[0]));
        const myBlackPts=myBlackCards.reduce((acc,c)=>acc+(+c.slice(1)),0);
        const palermo=r.st[i].sw||0;
        const myScore=myBlackPts+5*palermo;
        const enemies=r.seats.map((_,idx)=>idx).filter(idx=>{
          if(idx===i)return false;
          if(r.hp&&r.hp[idx]<=0)return false;
          if(r.cfg.boss&&((i===0&&idx===2)||(i===2&&idx===0)))return false;
          if(r.team&&r.team[i]&&r.team[idx]&&r.team[i]===r.team[idx])return false;
          return true;
        });
        if(!enemies.length)return `【處置】發動，但場上沒有存活的敵方玩家！`;
        const hitOpp=(targetIdx,rawDmg)=>{
          const B_atk=calcBuffs(r.chars[i],r.st[i]);
          const B_def=calcBuffs(r.chars[targetIdx],r.st[targetIdx]);
          let v=Math.max(0,rawDmg+B_atk.strong-B_atk.weak);if(v>0&&envBlood(r))v+=2;
          (r.st[i].fx||[]).forEach(x=>{if(x.k==='dm')v=Math.round(v*(1+x.n))});
          v=Math.max(0,v+B_def.vuln-B_def.guard);
          (r.st[targetIdx].fx||[]).forEach(x=>{if(x.k==='rd')v=Math.round(v*(1-x.n))});
          if((r.st[targetIdx].shield||0)>0){
            const abs=Math.min(r.st[targetIdx].shield,v);
            r.st[targetIdx].shield-=abs;
            r.st[targetIdx].shieldPersistent=Math.max(0,(r.st[targetIdx].shieldPersistent||0)-abs);
            addDamageFx(damage,r,targetIdx,abs,undefined,true);
            if(abs>0)landed=true;
            return {dmg:v,actual:0,shieldAbs:abs};
          }
          const beforeHp=r.hp[targetIdx];
          r.hp[targetIdx]=Math.max(0,damagedHp(beforeHp,characterMaxHp(r,targetIdx,r.chars[targetIdx],r.st[targetIdx]),v,r.chars[targetIdx],r.st[targetIdx]));
          recordHpLoss(r.chars[targetIdx],r.st[targetIdx],beforeHp,r.hp[targetIdx]);
          addDamageFx(damage,r,targetIdx,beforeHp-r.hp[targetIdx]);
          if(r.hp[targetIdx]<beforeHp)landed=true;
          return {dmg:v,actual:beforeHp-r.hp[targetIdx],shieldAbs:0};
        };
        enemies.forEach(eIdx=>{
          const eName=r.seats[eIdx].name;
          const oppHand=r.hands[eIdx]||[];
          const oppBlackCards=oppHand.filter(c=>'SC'.includes(c[0]));
          const oppScore=oppBlackCards.reduce((acc,c)=>acc+(+c.slice(1)),0);
          if(myScore>=oppScore){
            const removed=[];
            oppBlackCards.forEach(c=>{
              r.hands[eIdx]=removeCardOnce(r.hands[eIdx],c);
              if(r.up[eIdx]&&r.up[eIdx].includes(c)){
                r.up[eIdx]=removeCardOnce(r.up[eIdx],c);
                if(r.oc[eIdx]>0)r.oc[eIdx]--;
              }
              removed.push(cs(c));
            });
            while(r.up[eIdx]&&r.oc[eIdx]&&r.up[eIdx].length<Math.min(r.oc[eIdx],r.hands[eIdx].length)){
              const hid=subtractCards(r.hands[eIdx],r.up[eIdx])[0];
              if(hid)r.up[eIdx].push(hid);else break;
            }
            if(typeof moves!=='undefined'&&moves[r.round+'_'+eIdx]){
              try{db.doc(`rooms/${code}/moves/${r.round}_${eIdx}`).set(null)}catch(e){}
            }
            let totalDmg=0,hitLogs=[];
            for(let k=1;k<=5;k++){
              if(r.hp[eIdx]<=0)break;
              const res=hitOpp(eIdx,1);
              totalDmg+=res.actual;
              hitLogs.push(res.dmg+(res.shieldAbs?`[盾擋${res.shieldAbs}]`:''));
            }
            msgs.push(`⚔ vs ${eName}：瓦倫希娜 ${myScore}點（黑牌${myBlackPts}+巴勒莫${palermo}×5） vs ${oppScore}點 → 獲勝！銷毀其黑牌卡槽×${removed.length}（${removed.length?removed.join('、'):'無黑牌'}），並連擊5次造成共 ${totalDmg} 點傷害（單擊：${hitLogs.join('、')}，剩餘血量 ${r.hp[eIdx]}）`);
          }else{
            msgs.push(`⚔ vs ${eName}：瓦倫希娜 ${myScore}點 vs ${oppScore}點 → 失敗，無事發生`);
          }
        });
        return {log:[`【處置】發動！`+msgs.join('；')],hits:landed?[i]:[],damage};
      }
    },
    {id:2,name:'心-瓦倫希娜',type:'輔助型',desc:'獲得被動心-瓦倫希娜：預知眼不再過熱（若當前過熱則回復為3層），且每回合回復1層預知眼',
      instantFx:(r,i,o)=>{
        r.st[i].xinVal=1;
        let note='';
        if((r.st[i].heat||0)>0){
          r.st[i].heat=0;
          r.st[i].eye=3;
          note='（已解除過熱，預知眼回復為 3 層）';
        }
        return `獲得被動【心-瓦倫希娜】！預知眼將不再進入過熱${note}，且此後每回合結束時自動回復 1 層預知眼！`;
      }
    }
  ]};
CHARS.rien={n:'里恩',t:'',d:'每場自己有參戰的戰鬥開始時（兩人戰即每回合），隨機標記一張手牌為【指令牌】（明牌模式只標記明牌，所有人可見，淺藍色外框），指令牌點數+1。使用指令牌：♠/♣擊中、♦反擊成功、♥成功治療→獲得3層指令加護，失敗→1層（上限9）。沒用指令牌→業【福爾圖娜】+1：每2層獲得1層易損（受到傷害+1）、每3層獲得1層虛弱（出牌點數-1）。指令加護3/6/9層→解放1/2/3（不並存）：解放1獲得1層守護；解放2獲得1層強壯、1層守護；解放3獲得2層強壯、2層守護，並可在自己參戰的戰鬥發動【Furioso-Replica】（整場遊戲只能發動一次）：不出牌、直接結束回合，基礎傷害1的攻擊連擊9次（廣域亂射：每擊隨機選目標——三人戰隨機選對手，3v3隨機選敵方一名角色，含後備；受被動影響）；發動後清除業、不再累積業，指令加護與解放保留。25絕技：【指令成癮】（指令牌對其他玩家隱藏，且指令牌點數增幅改為+8）、【心-里恩】（解除所有業，額外獲得等同當前解放層數的強壯與守護）。',
  d25Skills:[
    {id:1,name:'指令成癮',type:'進攻型',desc:'指令牌將不再顯示給其他玩家知曉，且指令牌獲得的點數增幅從+1改為+8',

CHARS.ring={n:'卡利斯托',t:'',d:'任何攻擊（含反擊）實際造成傷害時，敵方最大生命值-1，並獲得等量活體材料；活體材料達5層後，任何攻擊成功使敵方最大生命值-2。梅花攻擊的最大生命降低量加倍；成功梅花斷補時固定使敵方最大生命值-5。每3層活體材料獲得1層強壯（出牌點數+1）。最大生命最低為1，現有生命會被壓到新上限以下。自身血量為1時獲得主動技【閉館】：任何牌變為特殊攻擊，造成敵方最大生命值點傷害，優先於所有花色牌、僅次於天殺，方塊無法阻擋或反擊。25絕技：【人體觀測】（敵方玩家最大生命值直接砍半，不獲得活體材料）、【在現場獲取並加工材料的美學】（活體材料除每3層給1層強壯外，同時根據活體材料數量提升自身最大生命值，且增加時當前生命也一起增加）。',
  d25Skills:[
    {id:1,name:'人體觀測',type:'進攻型',desc:'使所有敵方玩家的當前最大生命值砍半（不獲得活體材料）',
      instantFx:(r,i,o)=>{
        const msgs=[];
        r.seats.forEach((seat,sIdx)=>{
          if(sIdx===i||r.hp[sIdx]<=0)return;
          // 計算當前最大生命（含mdec）
          const baseMx=Math.max(1,Math.round(r.cfg.hp*(r.chars[sIdx]==='san'?1.2:1)*(r.cfg.boss&&sIdx!==1?1.5:1))+(r.chars[sIdx]==='leoc'?5-r.cfg.hp:0));
          const curMx=Math.max(1,baseMx-(r.st[sIdx].mdec||0));
          const reduction=Math.floor(curMx/2);
          if(reduction>0){
            r.st[sIdx].mdec=(r.st[sIdx].mdec||0)+reduction;
            // 當前血量不超過新上限
            const newMx=Math.max(1,baseMx-(r.st[sIdx].mdec));
            if(r.hp[sIdx]>newMx){const before=r.hp[sIdx];r.hp[sIdx]=newMx;recordHpLoss(r.chars[sIdx],r.st[sIdx],before,newMx)}
            msgs.push(`${seat.name} 最大生命值 -${reduction}（現上限 ${newMx}）`);
          }
        });
        return `【人體觀測】發動！`+msgs.join('；');
      }
    },
    {id:2,name:'在現場獲取並加工材料的美學',type:'輔助型',desc:'活體材料除每3層給1層強壯外，同時根據活體材料數量提升自身最大生命值（增加時當前生命也一起增加）',
      instantFx:(r,i,o)=>{
        r.st[i].ringAesthetic=1;
        // 立即根據現有活體材料計算初始加成
        const lm=r.st[i].lm||0;
        r.st[i].ringMdecBonus=-(lm); // 用負mdec來提升上限（ringMdecBonus存儲加成量）
        const bonus=lm;
        const hpGain=envHeal(r,healingGain(r.st[i],bonus));
        const beforeHp=r.hp[i],healing=[];if(hpGain>0)r.hp[i]+=hpGain;addHealingFx(healing,r,i,r.hp[i]-beforeHp);
        return {log:[`獲得被動【在現場獲取並加工材料的美學】！當前活體材料 ${lm} 層，最大生命值立即 +${bonus}，當前生命增加 ${hpGain}${healingNote(r.st[i])}！此後活體材料每增加，最大生命提升，當前生命回復仍受禁療影響！`],healing};
      }
    }
  ]};
CHARS.san={n:'桑丘',t:'',d:'最大生命上限為設定基礎生命值的1.2倍，開場當前生命值仍為設定值。攻擊（含反擊）附帶傷害30%（向上取整，至少1）的吸血；任何回血都會獲得等量血宴。血宴≥5可發動主動技【血宴強化】：不足10層為一階（消耗5層），10層以上自動為二階（消耗10層），發動回合不累積血宴。一階：♠吸血雙倍；♣被阻止的回復量改為回復自己；♥治療量×1.5，若被梅花斷補則改為回復原治療量×0.4（向上取整）；♦獲得5點護盾（到自己下一個回合結束）。二階：♠吸血3倍；♣傷害不減半，並同樣吸走被阻止的回復；♥治療量×1.5，梅花斷補不會阻止治療且以原點數計算；♦護盾額外多撐2場自己的戰鬥，並獲得3場戰鬥的硬血盾（等效2層守護：受到傷害-2，最低0）。25絕技：【La Sangre】（對當前敵人造成自身血宴層數×1.5的固定傷害，三人戰時隨機選擇敵人）、【滿足壓抑許久的飢餓吧】（獲得10層血宴，且接下來獲得的血宴×1.5倍）。',
  d25Skills:[
    {id:1,name:'La Sangre',type:'進攻型',desc:'對當前敵人（三人戰時為隨機敵人）造成自身血宴層數×1.5的固定傷害',
      instantFx:(r,i,o)=>{
        const f=r.st[i].feast||0;
        const dmg=Math.floor(f*1.5);
        let target=o;
        if(r.seats.length===3&&!r.team){
          const aliveEnemies=r.seats.map((_,idx)=>idx).filter(idx=>idx!==i&&r.hp[idx]>0);
          if(aliveEnemies.length)target=rnd(aliveEnemies);
        }
        if(target===undefined||target===null||r.hp[target]<=0){
          return `【La Sangre】發動，但沒有存活的目標！`;

        const before=r.hp[target];

        recordHpLoss(r.chars[target],r.st[target],before,r.hp[target]);
        const actual=before-r.hp[target];
        const damage=[];addDamageFx(damage,r,target,actual);
        return {log:[`發動【La Sangre】！根據當前血宴 ${f} 層，對 ${tNm} 造成 ${dmg} 點固定傷害（實際扣除 ${actual} 點生命，剩餘血量 ${r.hp[target]}）！`],hits:actual>0?[i]:[],damage};
      }
    },
    {id:2,name:'滿足壓抑許久的飢餓吧',type:'輔助型',desc:'獲得10層血宴，且接下來獲得的血宴×1.5倍',
      instantFx:(r,i,o)=>{
        r.st[i].feastBoost=1;
        const add=Math.round(10*1.5);
        r.st[i].feast=(r.st[i].feast||0)+add;
        return `發動【滿足壓抑許久的飢餓吧】！獲得被動【飢餓滿足】（接下來獲得的血宴×1.5倍）並獲得 10×1.5 = ${add} 層血宴（現有 ${r.st[i].feast} 層）！`;
      }
    }
  ]};

CHARS.nut={n:'高堅果',t:'',f:'pvz',v3only:true,d:'【PVZ陣營】3v3專用角色，不可出陣，只能永久待在後備。血量上限及基礎血量為設定值×1.2。此角色存活時，我方任何角色受到傷害時，傷害（已計算完易損、守護、護盾等後的最終傷害）將轉移到高堅果身上（包括斬殺）；高堅果倒下後不再保護。'};

const RULES=`<details class="box"><summary>規則說明</summary><div class="mut">
環境事件：房主可在開房前開關；開啟後每隔3～5回合隨機一項，不連續重複。事件涵蓋所有存活角色，包含後備；不復活已倒下角色。<br>${Object.values(ENV_EVENTS).map(e=>esc(e.icon+e.n+'：'+e.d)).join('<br>')}<br>命運加成不改卡牌原始點數，麻痺與神滅的固定點數仍優先。沉默期間所有特殊狀態保留且不扣回合，倒下與手動換人照常；沉默結束後恢復技能與絕技彈窗。<br>每回合兩位對決者同時各出一張牌（三人戰由輪到的玩家轉輪盤，依對手血量比例抽出對手，第三人旁觀；輪盤順序輪流）。<br>
♠ 黑桃：造成「數字」傷害；雙方都出黑桃時，數字小的先攻擊（先打死對方則對方攻擊失效）。<br>
♣ 梅花：造成「數字÷2（進位）」傷害，並使對手本回合治療無效。<br>
♥ 紅心：回復「數字」點血量，不超過血量上限。<br>時間殺人魔：生命分為5段，單次傷害不跨血條；治療前當前血條已滿時，改補回1條且該條為1血。輔助絕技永久使所有敵方玩家每次出牌限時5秒，出牌即停，逾時出戰角色直接死亡；退牌後重新給予5秒，旁觀與不可出牌階段暫停。<br>
♦ 方塊：免疫攻擊，並反擊攻擊者「方塊數字」點傷害。<br>
結算順序：梅花封鎖治療 → 黑桃（由小到大）→ 梅花 → 治療（先倒下者治療無效）。<br>角色選角系統：2／3人戰各玩家依序選一名不同角色，也可在房主設定關閉；3v3先禁用再選角。<br>3v3 角色戰（雙人）：先禁用角色再依順序選角（先手1、後手2、先手2、後手1，先後手隨機），首選可上場角色出戰、PVZ植物固定後備；角色倒下換下一位（按選角順序），每人有2次手動換人（拖曳後備頭像到出戰角色，下回合換上；換人生效前點擊出戰角色可取消，取消不扣次數），先擊敗對方所有角色獲勝。各角色狀態不共通。<br>陣營【Limbus】：理智值系統，詳見角色說明。<br>陣營【PVZ】：僅限3v3，每隊最多選2名後備植物，植物不可上場；火炬樹樁和向日葵提供護盾、守護及支援技能。<br>傷害計算：基礎點數×點數倍率（倍率為加法疊加，例如+50%與+70%是×2.2，不是×2.55）＋強壯−虛弱；各角色給與的易損、虛弱、強壯等效果皆可疊加，並各自有回合計數。<br>暈眩＝該回合無法出牌、無法行動。<br>陣營【軌跡】：CP值（血量下方綠條，初始0、上限200，3v3全隊共用，換人或倒下都保留）：造成傷害+15、受到傷害+10；戰技＝消耗CP使用，於下個回合開始時（所有玩家出牌前）生效；S技＝消耗CP的大招、使用時立即生效，若對手已出牌會退還其卡片讓其重新出牌。<br>名詞解釋：廣域亂射＝每次攻擊都隨機指定目標（里恩的Furioso即是）；群體＝3v3中給予敵方所有人（包括後備）效果，若對方只剩一人或為一般模式，則該技能的效果翻倍（大地之牆除外，永遠只有一次）。<br>增減益名詞：易損＝受到傷害＋層數；虛弱＝出牌點數－層數；強壯＝出牌點數＋層數；守護＝受到傷害－層數。<br>「我牌太爛啦！」：出牌階段可無限使用，每次立即結束本回合、重抽手牌並受到遞增傷害：第1次5點、第2次10點，之後每次增加5點。<br>三人戰旁觀者可猜哪方點數較大：猜中選擇回 1 血或對較大者 1 傷害；點數相同則自損 5 點；不猜無事發生。<br>連續防守懲罰：若連續兩回合出方塊（♦）且均未成功反擊，則第三回合無法出方塊牌。<br>二十五之刻（25絕技）：交鋒區上方設有各玩家的25點橫向計量表。當♠攻擊命中、♣斷補成功、♦反擊成功時，將該牌原始點數（A=1、J=11、Q=12、K=13）累加至計量表；♥以實際回復自身的生命量累積，滿血或未補到血時不增加。剛好集滿25點時，下回合初觸發「完美決鬥」特效彈窗，玩家可於彈窗出現時直接點選發動一項專屬絕技並立即生效（每種角色有專屬絕技，預設為造成15點傷害或回復15點生命；關閉彈窗後出牌階段無法使用）。每次資格開放僅有一位玩家取得完美決鬥資格；「二次機會」事件可重新開放，已發動過絕技者不能再次發動；若多位玩家同回合集滿25點，先公告5秒，再開放達成者點擊5秒，每人每秒最多計入${D25_CLICK_LIMIT}次；以「5＋有效點擊數」為權重轉輪盤，決定唯一的絕技發動者。零次仍保有基本權重，全部零次時平均抽選；公告、點擊與輪盤期間出牌與倒數暫停；若點數超過25點則「爆牌崩壞」，無法再發動絕技。擁有專屬絕技的角色會播放優先級2的25絕技BGM（assets/[角色素材代號]ex.mp3；艾蘭為bugex.mp3、雷橫為leiex.mp3），只播放一次，結束後恢復原本的戰鬥BGM；優先級1的戰鬥BGM仍優先，缺少專屬曲時沿用戰鬥BGM。<br>
良秀平衡調整：主動技【天殺】現在具備 1 回合冷卻時間；良秀專屬25絕技為進攻型【天殺-斷】（消除除自己外全體玩家手牌最多3張，優先明牌且最低保留1張）與輔助型【血缘【けつえん】】（手牌補至上限，且天殺不再消除自己的卡牌）。<br>
瓦倫希娜25絕技：進攻型【處置】（自身所有黑牌點數+5*巴勒莫層數與每位敵方玩家所有黑牌拼點，獲勝時銷毀對方黑牌槽並造成1*5受威力增減影響的單方面攻擊，失敗無事發生）、輔助型【心-瓦倫希娜】（獲得被動【心-瓦倫希娜】：預知眼不再過熱，若當前過熱則回復為3層，且每回合結束時自動回復1層預知眼）。<br>
李箱：全局第3、6、9…回合，存活的李箱（含後備及旁觀）於出牌前選擇4個不同隨機場地事件中的1個，與原場地並存；期間全員行動及倒數暫停。鏡子技術永久改為從完整可用事件清單自選。強制平等將全場所有存活角色（含後備）血量設為李箱發動時的目前血量，可超過生命上限，再對敵方全體含後備造成基礎3點傷害；不復活倒下角色。<br>
金笠：基礎點數10以上的黑牌可選擇【捨吾皮肉】，取代原花色效果，命中固定3點傷害，不附斷補等功能，仍受牆、護盾及高堅果攔截。被方塊成功反擊且存活後立即發動【斷汝筋骨】，對反擊者單方面連斬4次，每擊基礎4點，逐擊計算增減傷、護盾及毅力；斷汝筋骨不限次，首次致命反擊保留1血的保命僅一場一次，其他傷害不受保護。進攻型絕技【大爆捨】永久允許任何黑牌使用捨吾皮肉；輔助型【綻放ego::金笠】使斷汝筋骨改為全體敵人含後備的群體攻擊，並獲得常駐強壯1。<br>
艾蘭25絕技：進攻型【超追擊】使夜錐追擊最終傷害固定5，不受增減傷影響，仍可被護盾、高堅果或大地之牆抵擋；輔助型【超深度創傷】給予全場敵方角色（含後備）永久禁療，覆蓋創傷與深度創傷；所有生命回復無效，換人或艾蘭離場不會解除。<br>
雷橫25絕技：進攻型【超絕猛虎殺擊亂斬】對全場敵人（含後備）連擊6次，每次隨機造成1～3點固定傷害，不受威力增減或減傷影響，仍可被護盾、高堅果或大地之牆抵擋，單一敵人也不翻倍；輔助型【心-雷橫】從戰鬥第一回合累積自身實際生命損失，每5點獲得1層永久強壯，包含絕技發動前、自損及後備受傷的損失，回血不抵銷，護盾損失不計，換人保留。<br>
摩西：♠攻擊成功／♣斷補成功累積紅煙霧、♦反擊成功累積紫煙霧、♥實際回復自身生命累積白煙霧；每次累積出牌基本點數的層數，不含強壯、虛弱或倍率，也不依實際傷害或回血量計算，各色上限6，深紅上限20並沿用相同累積規則。出牌前可消耗所選每色各6層使用吐息；效果當回合生效，對手已出的牌會退回。${Object.entries(MOSES_BREATHS).filter(([id])=>id!=='crimson').map(([,B])=>esc(B.n+'：'+B.d)).join('；')}。理智變化遵守-45～45上限；回血遵守減療、禁療及生命上限。紅點將現有及之後的煙霧合併為深紅，上限20；消耗20層準備吐息-深紅，本回合結算先於萊萬汀斬殺，仍受天殺及既有斬殺防護規則影響。青煙與一般場地並存，包含發動回合共5個全局回合，每回合結束只對當回合出戰的兩名玩家造成5點固定環境傷害；牆、護盾及高堅果仍可攔截。<br>
護盾視為臨時生命：實際扣除護盾也算攻擊命中，會觸發攻擊音效及命中效果；里恩的黑色指令牌扣到護盾時會獲得3層指令加護。護盾仍會攔截整次傷害，溢出部分不會扣除血條。<br>
明牌模式：部分手牌公開給所有人；出牌並抽牌後，從手上暗牌中選擇要保持暗牌的牌，其餘補成明牌。暗牌模式：看不到他人手牌。逾時未出牌會自動隨機出牌。A=1、J=11、Q=12、K=13。</div></details>`;

    <div class="row"><button class="pri" onclick="startTest()">開始測試</button></div></div></div>${RULES}`;return}
  const top=`<div class="combat-room-strip row" style="justify-content:space-between;margin:0 0 8px"><span class="mut">房間代碼 <b class="code" style="font-size:20px;letter-spacing:4px">${esc(code)}</b></span><button onclick="leave()">離開</button></div>`;
  if(!room){
    const j=sortedJoins(),cfg=j[0]&&j[0].cfg,host=j[0]&&j[0].id===uid;
    if(!cfg){A.innerHTML=top+`<div class="box">找不到這個房間（或正在連線…）</div>`;return}

    <div class="mut">血量 ${cfg.hp}｜手牌 ${cfg.hand}｜${cfg.open?'明牌 '+cfg.open+' 張':'暗牌模式'}｜${cfg.time?'限時 '+cfg.time+' 秒':'不限時'}${cfg.chars?'｜角色選角':''}｜環境事件${cfg.events?'開啟（每3～5回合）':'關閉'}</div>
    ${cfg.chars&&!cfg.v3&&!cfg.boss?`<div class="row"><label><input type="checkbox" ${cfg.ban?'checked':''} ${host?'':'disabled'} onchange="setLobbyBan(this.checked)"> 角色禁用（每人1名，順序隨機）</label></div>`:''}
    ${j.map((p,i)=>`<div>${i>=cfg.n?'（旁觀）':''}${esc(p.name)}${p.id===uid?'（你）':''}${i===0?' 👑':''}</div>`).join('')}
    <div class="row">${host?`<button class="pri" ${j.length>=cfg.n?'':'disabled'} onclick="startGame()">開始遊戲</button>`:'<span class="mut">等待房主開始…</span>'}</div>
    <div class="mut">把房間代碼傳給朋友，請他們開同一個網頁並輸入代碼。</div></div>`;return}
  if(room.status==='pick'){A.innerHTML=top+normalPickUI(rd());return}
  if(room.status==='ban'){A.innerHTML=top+banUI(rd());return}
  if(room.status==='draft'||room.status==='bossDraft'){A.innerHTML=top+draftUI(rd());return}
  const s=rd(),cfg=room.cfg,names=room.seats.map(p=>p.name),playing=room.status==='playing';
  const pls=room.seats.map((p,i)=>{
    const inPair=playing&&room.phase==='play'&&room.pair.includes(i),done=inPair&&moves[room.round+'_'+i]||room.phase==='reveal'&&moves['v'+room.round+'_'+i];
    const hid=room.hands[i].length+(i===s?privateSunCards.length:0)-room.up[i].length;
    return`<div data-damage-target="${i}:summary" class="pl ${room.hp[i]<=0?'dead':''}">${!room.pair.includes(i)?environmentTargetFxUI(i,room.team?room.act[i]:-1):''}<div class="row" style="justify-content:space-between;margin:0"><b class="${i===s?'me':''}">${cfg.boss?(i===1?'👑 Boss｜':'🤝 挑戰者｜'):''}${esc(p.name)}${room.chars[i]?'【'+CHARS[room.chars[i]].n+'】':''}${i===s?'（你）':''}${playing&&room.turn===i&&cfg.n===3?' 🎯':''}${inPair?' ⚔️':''}</b><span>${Math.max(0,room.hp[i])} / ${maxHp(i)} ${done?'✅':''}</span></div>
    ${healthBarUI(i)}${timeClockUI(i)}${combatStatusUI(i)}
    ${i!==s?`<div class="mut">${room.up[i].map(c=>chip(c,i)).join('')} ${hid?`🂠×${hid}`:''}</div>`:''}${!room.pair.includes(i)||(d25AuraOf(i)&&d25AuraOf(i).char!==room.chars[i])?d25AuraUI(i,true):''}</div>`}).join('');
  const timer=playing&&room.deadline?'<div class="mut" id="tm"></div>':'';
  let act='';
  if(!playing)act=`<b style="font-size:18px">${room.winner>=0?'🏆 '+(cfg.boss?(room.winner===1?'Boss方':'挑戰者方')+'（'+esc(names[room.winner])+'）':esc(names[room.winner]))+' 獲勝！':'平手！全員倒下'}</b><div class="row" style="justify-content:center"><button class="pri" onclick="rematch()">再來一場</button><button onclick="leave()">離開房間</button></div>`;
  else if(mirrorPending())act='<span class="mut">🪞 等待李箱選擇鏡世界，全員行動與倒數暫停…</span>';
  else if(d25DrawPending())act='<span class="mut">🎡 完美決鬥資格抽選中，出牌與倒數暫停…</span>';
  else if(environmentTradePending())act=s>=0&&room.hp[s]>0?environmentTradeUI(s):'<span class="mut">等待所有存活玩家完成命運交易…</span>';
  else if(s<0)act='<span class="mut">你是旁觀者</span>';
  else if(room.hp[s]<=0)act='<span class="mut">你已被淘汰，等待結果…</span>';
  else{const mine=room.hands[s],up=room.up[s];
    if(room.phase==='answer'){
      const q=room.question||{},target=q.target,asker=q.by,question=q.kind==='max'?'你的最大點數是多少？':`你的${SU[q.suit]}有幾張？`;
      if(s===target){const submitted=moves['a'+room.round+'_'+s],cards=[...(room.hands[s]||[]),...(test?(hostSunCards[s]||[]).filter(x=>x.expires>=room.round).map(x=>x.card):privateSunCards.map(x=>x.card))];act=`<div>賈丘問你：${esc(question)}</div><div class="mut">你的手牌（已出牌已退回）：</div><div class="hand">${cards.map(c=>`<span class="chip ${RED[c[0]]?'r':''}">${cs(c)}</span>`).join('')||'<span class="mut">沒有手牌</span>'}</div>${submitted?`<div class="mut">你回答：「${esc(submitted.answer)}」，等待判定…</div>`:`<div class="row" style="justify-content:center"><input id="jiaAnswer" type="number" min="0" max="13" placeholder="回答數字"><button class="pri" onclick="answerJia()">回答</button></div>`}`}
      else{const response=moves['a'+room.round+'_'+target];act=`賈丘正在詢問 ${esc(names[target])}：${esc(question)}${response?`<div class="mut">${esc(names[target])} 回答：「${esc(response.answer)}」，等待判定…</div>`:'<div class="mut">等待對方回答…</div>'}`}
    }else if(room.phase==='play'){
      if(!room.pair.includes(s))act=cfg.boss?'<div><b>與另一名挑戰者互為隊友</b><div class="mut">本回合由另一位挑戰者出戰；你不會被當作敵人或旁觀猜測者。</div></div>':specView(s);
      else if(!envSilent(room)&&(room.st[s].stun||0)>0)act='😵 你被暈眩，本回合無法出牌或行動'
      else if(!envSilent(room)&&(room.st[s].san||0)<=-45&&CHARS[room.chars[s]]?.f==='bus')act='🌀 理智 -45：侵蝕中，系統將隨機選牌並依花色觸發侵蝕效果；本回合結算後，下回合理智重置為0'
      else if(moves[room.round+'_'+s])act=`你已出牌 <b>${moves[room.round+'_'+s].hidden?'暫時手牌':moves[room.round+'_'+s].rep?'Furioso-Replica':moves[room.round+'_'+s].redraw?'「我牌太爛啦！」':cs(moves[room.round+'_'+s].card)}</b>，等待對手…${dihuiUI(s)}${plantsUI(s)}`;
      else act=playHandUI(s,mine,up,names)}
    else if(room.pend.includes(s)){
      if(moves['v'+room.round+'_'+s])act='已選擇，等待其他玩家…';
      else{const hid=subtractCards(mine,up),need=hid.length-Math.max(0,room.oc[s]-up.length);
        act=`<div class="mut">選擇要保持暗牌的牌（${hideSel.length}/${need}），其餘將公開</div><div class="hand">${hid.map((c,index)=>`<button class="c concealed ${RED[c[0]]?'r':''} ${hideSlots.includes(index)?'sel':''}" onclick="toggleHide('${c}',${index})">${cardFace(c)}</button>`).join('')}</div>`}}
    else act='等待對方選擇亮牌…'}
  if(test)act=`<div class="mut">🧪 目前操作：${esc(names[s])}</div>`+environmentTestUI()+testD25ContestUI()+act;

  if(s>=0&&room.chars[s]){const C=CHARS[room.chars[s]],fd=room.chars[s]==='verg'?'維吉里烏斯理智固定顯示「?」，不套用Limbus共通理智增減傷、侵蝕或理智變化。':FACD[C.f];h+=`<details class="box"><summary>我的角色：${C.n}${C.t?'・'+C.t:''}</summary><div class="mut">陣營【${FAC[C.f]}】：${fd}<br>${C.d}</div></details>`}
  A.innerHTML=h+RULES;animHp();flushCombatFx();syncCombatRecoil();flushHealingFx();flushDamageFx();focusD25Dialog()}

/* ---------- 點對點連線（房主當伺服器，PeerJS/WebRTC） ---------- */
const store={},subs=[];let peer=null,conns=[],hostConn=null,isHost=false;
const snapDoc=p=>({exists:p in store,data:()=>store[p],id:p.split('/').pop()});
const direct=(k,p)=>k.startsWith(p+'/')&&!k.slice(p.length+1).includes('/');
const snapCol=p=>({docs:Object.keys(store).filter(k=>direct(k,p)).map(k=>({id:k.split('/').pop(),data:()=>store[k]}))});
function notify(path){subs.slice().forEach(x=>{if(x.t==='d'?x.p===path:direct(path,x.p))x.fn(x.t==='d'?snapDoc(x.p):snapCol(x.p))})}
const bcast=m=>conns.forEach(c=>{try{c.send(m)}catch(e){}});
function send(p,d){if(mirrorPending()&&typeof p==='string'&&p.startsWith(`rooms/${code}/moves/`))return;d=JSON.parse(JSON.stringify(d));
  // 訂閱回呼可能立即推進階段，只傳送仍為最新狀態的一次寫入。
  if(isHost){if(!allowTimeMove(p,d)){setTimeout(tick,0);return}store[p]=d;notify(p);if(store[p]===d)bcast({p,d,hostTime:Date.now()})}else if(hostConn)hostConn.send({w:1,p,d})}
const sub=(t,p,fn)=>{const x={t,p,fn};subs.push(x);fn(t==='d'?snapDoc(p):snapCol(p));return()=>{const i=subs.indexOf(x);if(i>=0)subs.splice(i,1)}};
db={doc:p=>({set:async d=>send(p,d),onSnapshot:fn=>sub('d',p,fn)}),collection:p=>({onSnapshot:fn=>sub('c',p,fn)})};
function netClose(){try{peer&&peer.destroy()}catch(e){}peer=null;conns=[];hostConn=null;isHost=false;subs.length=0;Object.keys(store).forEach(k=>delete store[k])}
function netHost(c){return new Promise((res,rej)=>{isHost=true;peer=new Peer('d25-'+c);
  peer.on('open',()=>res());peer.on('error',rej);
  peer.on('connection',cn=>{
    cn.on('open',()=>{conns.push(cn);cn.send({full:store,hostTime:Date.now()})});
    cn.on('data',m=>{if(m&&m.privateRequest){handlePrivateRequest(cn,m.privateRequest);return}if(m&&m.w){if((mirrorPending()||environmentTradePending())&&typeof m.p==='string'&&m.p.startsWith(`rooms/${c}/moves/`))return;const prefix=`rooms/${c}/joins/`;if(typeof m.p==='string'&&m.p.startsWith(prefix)){const joining=m.p.slice(prefix.length);if(cn.uid&&cn.uid!==joining)return;cn.uid=joining}if(!allowTimeMove(m.p,m.d,cn.uid)){setTimeout(tick,0);return}store[m.p]=m.d;notify(m.p);if(store[m.p]===m.d)bcast({p:m.p,d:m.d,hostTime:Date.now()})}});
    cn.on('close',()=>{conns=conns.filter(x=>x!==cn)})})})}
function netJoin(c){return new Promise((res,rej)=>{isHost=false;peer=new Peer();peer.on('error',rej);
  peer.on('open',()=>{hostConn=peer.connect('d25-'+c,{serialization:'json',reliable:true});
    const to=setTimeout(()=>rej(new Error('timeout')),12000);
    hostConn.on('open',()=>{clearTimeout(to);res()});
    hostConn.on('data',m=>{if(Number.isFinite(m.hostTime))hostClockOffset=m.hostTime-Date.now();if(m.privateData){handlePrivateData(m.privateData);return}if(m.full)Object.keys(m.full).forEach(k=>{store[k]=m.full[k];notify(k)});else{store[m.p]=m.d;notify(m.p)}});
    hostConn.on('close',()=>{if(code){alert('與房主的連線中斷了，遊戲結束');leave()}})})})}
updAud();uid=Math.random().toString(36).slice(2,10);render();
