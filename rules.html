<title>規則介紹｜決鬥25點</title>
<style>
:root{color-scheme:light;--ink:#242a2b;--muted:#66706d;--line:#dce1dc;--accent:#355c46;--paper:#fff;--bg:#f5f6f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.7}a{color:inherit}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
.shell{max-width:1180px;margin:auto;padding:28px 28px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:14px;color:var(--muted)}.back{padding:7px 14px;border:1px solid var(--line);border-radius:7px;background:var(--paper);text-decoration:none;font-size:14px}.layout{display:grid;grid-template-columns:170px minmax(0,1fr);gap:42px;margin-top:36px}.rule-nav{position:sticky;top:24px;align-self:start;display:grid;gap:5px}.rule-nav a{display:block;padding:10px 14px;border-radius:7px;text-decoration:none;color:var(--muted)}.rule-nav a:hover{background:#e9eee7}.rule-nav a[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
h1{font-size:32px;line-height:1.35;margin:0 0 10px;letter-spacing:.03em}h2{font-size:20px;margin:32px 0 14px}h3{font-size:17px;line-height:1.5;margin:0 0 8px}p{margin:0 0 12px}.intro{color:var(--muted);margin-bottom:26px;max-width:38em}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card,.panel{padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:10px}.card p:last-child,.panel p:last-child{margin-bottom:0}.card p{font-size:15px}.label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.callout{padding:18px 22px;border-left:3px solid var(--accent);background:#eaf0e7;margin-bottom:22px;border-radius:0 7px 7px 0}.callout p{margin:0}.steps{display:grid;gap:12px;counter-reset:step;list-style:none;padding:0;margin:0}.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px}.steps li:before{counter-increment:step;content:counter(step);color:var(--accent);font-weight:700}ul{padding-left:20px;margin:10px 0 0}li+li{margin-top:7px}.muted{color:var(--muted);font-size:14px}.suit{font-size:25px;margin-right:8px}.red{color:#a9423e}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--paper);min-width:0}.toolbar input{flex:1}.toolbar select{max-width:100%}.count{margin:0 0 12px;color:var(--muted);font-size:13px}.character details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.character summary{cursor:pointer;font-size:14px;color:var(--accent)}.character details p{margin:12px 0 0;font-size:14px}.character details b{display:block;margin-bottom:2px}.character details p:last-child{margin-bottom:0}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:#fff}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#edf1eb;font-weight:600}tr:last-child td{border-bottom:0}td:first-child{white-space:nowrap}table caption{text-align:left;padding:16px;font-weight:600}.footer{border-top:1px solid var(--line);margin-top:32px;padding-top:18px;color:var(--muted);font-size:13px}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:760px){.shell{padding:20px 18px 40px}.layout{display:block;margin-top:20px}.rule-nav{display:flex;position:static;overflow-x:auto;padding:0 0 10px;margin-bottom:24px;gap:6px}.rule-nav a{white-space:nowrap;font-size:14px;padding:8px 12px}h1{font-size:27px}.cards{gap:12px}.card,.panel{padding:18px}.top{gap:10px}.brand{font-size:12px}}
@media(max-width:480px){.cards{grid-template-columns:1fr}.toolbar{align-items:stretch;gap:8px}.toolbar input{width:100%;flex-basis:100%}.toolbar select{flex:1}.back{padding:6px 10px;white-space:nowrap}th,td{padding:10px 12px}.callout{padding:16px}.layout{margin-top:18px}}
</style>
</head>
<body>

  <header class="top"><span class="brand">決鬥25點 · 遊戲指南</span><a class="back" href="duel25.html">返回主選單</a></header>

    </nav>

<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(title,text,label='')=>`<article class="card">${label?`<span class="label">${esc(label)}</span>`:''}<h3>${title}</h3><p>${text}</p></article>`;
const intro=(title,text)=>`<h1 id="pageTitle" tabindex="-1">${title}</h1><p class="intro">${text}</p>`;
const factionNames={bus:'Limbus',pvz:'PVZ',trails:'軌跡',valorant:'Valorant'};
const RULE_CHARACTERS=[
  {id:'yoshi',f:'bus',n:'良秀',tag:'天殺星',d:'天殺優先封住對手牌效；命中刪除對手卡牌槽，自己也付出一格。方塊仍能擋下。',u:[['天殺-斷','其他玩家各失去最多3張手牌，至少留1張。'],['血缘【けつえん】','補滿手牌；天殺不再刪除自己的卡牌槽。']]},
  {id:'umb',f:'bus',n:'傘神',d:'受擊累積神罰；3層進入神怒，接下來2場參戰所有牌都算13點。',u:[['神雷','敵方全體含後備，2場參戰的牌固定1點。'],['神滅','自己2場參戰的牌固定24點；麻痺仍優先。']]},
  {id:'val',f:'bus',n:'瓦倫希娜',d:'互攻時用預知眼拼點，贏家才能攻擊，拼贏累積劍術。至少2層預知眼時，若剩餘手牌中最大方塊的原始點數≥敵方黑牌，自動消耗2層及該方塊閃避該次傷害並補抽一張手牌；每回合只消耗一張方塊與2層預知眼，該回合持續以該牌原始點數判定閃避，即使預知眼耗盡也能連閃，梅花斷補仍生效。預知眼歸零後過熱。',u:[['處置','以劍術強化黑牌拼點，勝時破壞敵方黑牌槽並攻擊。'],['心-瓦倫希娜','預知眼不再過熱，每回合回復1層。']]},
  {id:'rien',f:'bus',n:'里恩',d:'使用指令牌累積加護，3／6／9層逐步解放。忽略指令牌會累積負面效果。',u:[['指令成癮','指令牌點數改為+8，且對其他玩家隱藏。'],['心-里恩','清除業，依解放層數增加強壯與守護。']],more:'加護9層可使用一次 Furioso-Replica：9連擊，發動後不再累積業。'},
  {id:'ring',f:'bus',n:'卡利斯托',d:'攻擊降低敵方生命上限並累積材料，材料帶來強壯。1血時可用閉館造成重擊。',u:[['人體觀測','敵方玩家的最大生命直接減半。'],['在現場獲取並加工材料的美學','材料同時增加自己的生命上限與目前生命。']]},
  {id:'san',f:'bus',n:'桑丘',d:'生命上限×1.2；攻擊吸血30%。回血累積血宴，花5或10層強化各花色效果。',u:[['La Sangre','目前血宴層數×1.5，造成固定傷害。'],['滿足壓抑許久的飢餓吧','獲得10層血宴，之後血宴獲得量×1.5。']]},
  {id:'mat',f:'bus',n:'馬蒂亞斯',d:'受傷標記復仇對象；反擊成功累積包裝紙，3層取得保命毅力。',u:[['地獄之火','全體敵方玩家每回合開始獲得3層炎傷。'],['超毅力','觸發保命後，3回合內生命不低於1；限一次。']],more:'萊萬汀可斬殺復仇層數最高的目標；使用後清除該目標的復仇層數。'},
  {id:'shi_faust',f:'bus',n:'浮士德',tag:'四協',d:'拉弓期間蓄矢、降低非紅心點數；放矢削弱敵人，滿4矢還能取得紅矢。',u:[['立即矢裝填','立即獲得2層紅矢。'],['高速矢裝填','拉弓每回合直接獲得4矢。']],more:'每層紅矢強化一張黑牌：黑桃×3，梅花×5。'},
  {id:'lei',f:'bus',n:'雷橫',d:'開局8枚虎標彈，用彈加點數；耗盡後取得猛虎標彈，5枚可發動群體快刀亂麻。',u:[['超絕猛虎殺擊亂斬','敵方全體含後備受到6連擊，每擊固定1～3傷害。'],['心-雷橫','本局每實際損失5生命，永久獲得強壯1。']],more:'彈藥不會重裝；猛虎標彈用完後永久獲得虛弱3。'},
  {id:'dihui',f:'bus',n:'地彗星',d:'紅牌累積順行，黑牌累積逆行；可選下回合啟用效果，順行每層提供1層虛弱與守護，逆行每層提供1層易損與強壯。',u:[['殘像暴走','獲得3層殘像，對手出未標記牌時追加固定傷害。'],['心-地慧星','順行與逆行不再附帶負面效果。']],more:'順行與逆行總和每2層增加1層已確定的對手，會標記對手手牌。對手用未標記牌會增加殘像，之後自己的每次傷害附帶追擊。'},
  {id:'ailan',f:'bus',n:'艾蘭',d:'單次傷害超過5施加創傷；2層轉為深度創傷。低血或深度創傷目標會被夜錐追擊。',u:[['超追擊','夜錐追擊改為固定5傷害。'],['超深度創傷','敵方全體含後備，永久無法回血。']]},
  {id:'sinclair',f:'bus',n:'辛克萊',tag:'赤紅之神 · 3v3／佔2格',d:'隊伍用生命換出牌點數，累積無盡的飢餓；20層取得強壯與毅力。',u:[['la demande','永久於回合末追擊目前敵人，附加虛弱或易損。'],["l'appétit",'立即獲得15層無盡的飢餓。']],more:'飢餓40層可用一次 La Castration，對敵方全體造成15點傷害。'},
  {id:'jia_qiu',f:'bus',n:'賈丘',tag:'3v3／佔3格，附帶子路',d:'開局獲得護盾；問對手手牌資訊，答錯會減少期待。期待歸零時強壯+20。',u:[['時間到','獲得3場隊伍參戰的不再期待，期間強壯+20。'],['心-天罡星','問改為每回合可用；發動時期待降為1。']],more:'護盾破裂後綻放EGO，並在子路存活時換上子路。'},
  {id:'zilu',f:'bus',n:'子路',tag:'賈丘專屬後備',d:'命中施加破裂，目標受傷時追加破裂傷害。出牌後對手等待超過10秒，可累積強壯。',u:[['雲解顯現','敵方全體含後備立即獲得4層破裂。'],['超高速','先出牌時立即強壯+2，每回合一次。']],more:'自己的點數比對手小時，這次傷害不消耗破裂。'},
  {id:'rufo',f:'bus',n:'羅佳',tag:'環指野獸派',d:'完成四種花色任務中的任意三項，取得狼面並解鎖爆裂呈現；發動4連擊後，完成新任務可再用。',u:[['展現','爆裂呈現累計次數+3，提高連擊威力。'],['著色','爆裂呈現改為群體4連擊，含敵方後備。']]},
  {id:'heathcliff',f:'bus',n:'魔王希斯克利夫',d:'每回合取得一種花色盾。對手沒出該花色就累積棺；每7層棺取得1層毅力。',u:[['魔王所經之處，唯余悲傷與哀鳴','消耗所有棺，對一名敵人造成棺層數×4的基礎傷害。'],['杜拉罕','自己的攻擊與反擊永久變成群體傷害，含後備。']]},
  {id:'verg',f:'bus',n:'維吉里烏斯',tag:'3v3專用',d:'攻擊隨機+1～3傷害，黑牌命中施加炎傷。護盾破裂後強化，並定期刷新護盾。',u:[['為死去的血魔哀悼','敵方全體含後備受到5連擊，每擊基礎2傷害。'],['血幕-極','綻放EGO後每3回合取得的5點護盾可疊加。']],more:'不受共通理智影響；受到斬殺時改為承受基礎生命值的傷害。'},
  {id:'card_ish',f:'bus',n:'以實瑪利',tag:'定事務所',d:'打出組札花色累積光；打其他花色就更換組札。5層光可用光斬，每擊基礎4傷害、共5擊。',u:[['作弊','立即獲得3層光，上限5。'],['雙色','每回合多一種組札花色，兩色都能累積光。']]},
  {id:'yisang',f:'bus',n:'李箱',d:'每3個全局回合，從4個隨機環境中選1個，與原場地並存；後備與旁觀也能觸發。',u:[['強制平等','全場血量設為李箱目前血量，再對敵方全體含後備攻擊3點。'],['鏡子技術','每3回合可從完整環境清單自選。']]},
  {id:'bamboo',f:'bus',n:'金笠',d:'10點以上黑牌可用捨吾皮肉，固定3傷害；被成功反擊且存活時，發動4×4連斬。',u:[['大爆捨','任何黑牌都能用捨吾皮肉。'],['綻放ego::金笠','連斬改為群體攻擊，並永久強壯+1。']],more:'連斬不限次；開局持有1層毅力，一般致命傷害消耗1層並保留1血，斬殺無法阻擋。'},
  {id:'moses',f:'bus',n:'摩西',d:'出牌按基本點數集煙：黑牌紅、方塊紫、紅心白。回合初各色+1，各色6層可吐息。',u:[['紅點','煙霧改為深紅，20層可準備斬殺；回合初只補深紅+1。'],['青煙','5回合末出戰雙方各受5傷害；被抽為對手的機率−30個百分點。']],more:'吐息：紅給自己強壯、紫給對手虛弱、白回血加理智；混合吐息會強化效果。'},
  {id:'tkt',f:'bus',n:'時間殺人魔',d:'生命分5段，單次傷害不跨段。剩餘血條越少，強壯逐步轉為虛弱；滿段時回血可補回1血的新段。',u:[['時間殺人魔','對一名敵人造成目前回合數的固定傷害。'],['閉嘴，時間由我分配','所有敵人每次出牌限時5秒，逾時直接死亡。']]},
  {id:'nut',f:'pvz',n:'高堅果',tag:'3v3／固定後備',d:'生命×1.2，存活時代替隊友承受傷害，包含斬殺；倒下後保護停止。',u:[]},
  {id:'wood',f:'pvz',n:'火炬樹樁',tag:'3v3／固定後備',d:'開局給首發10護盾；火炬可用4次，使本回合點數×2。',u:[]},
  {id:'sunflower',f:'pvz',n:'向日葵',tag:'3v3／固定後備',d:'開局給首發永久守護1。每回合獲得1～3陽光，花4點自選一張7點暫時牌。',u:[]},
  {id:'rean',f:'trails',n:'黎恩',tag:'舒華澤',d:'戰技可封鎖、群攻或強化點數；S技神氣合一提供5回合的增傷、減傷與強化戰技。',u:[['無想神氣合一','永久神氣合一，傷害倍率1.8、減傷50%。'],['柒型-無','三種戰技的CP消耗永久減半。']]},
  {id:'estelle',f:'trails',n:'艾斯蒂爾',tag:'布萊特',d:'戰技削弱敵人或鼓舞隊友；S技太極輪使敵人暈眩2回合。',u:[['鳳凰烈波','敵方全體含後備暈眩1回合、炎傷4。'],['太陽','我方全體回血最大生命的一半，並獲得3場參戰的60%減傷。']]},
  {id:'leo',f:'trails',n:'劍帝萊維',tag:'3v3／佔3格',d:'CP獲得量×1.5，倒下可復活一次；戰技可削弱、造分身或施放大地之牆。',u:[['鬼炎斬','敵方全體含後備獲得炎傷6。'],['劍帝','召喚3個5血分身，己方全體永久強壯+1。']]},
  {id:'iso',f:'valorant',n:'離索',d:'商店買雙源、削減與應變，各存1次。雙源擋1次傷害，互攻後最多刷新1次。',u:[['決滅','選敵人1血單挑，只能出♠K／♦K；3次方塊額度，擋成功不扣。離索有1層雙源，勝者恢復原狀。'],['我要買大裝！','三個技能補滿各1次，經濟+3000。']],more:'削減：敵人本回合受傷×1.5。應變：雙方黑牌主攻傷害為0，反擊與追擊照常。'}
];
const RULE_ENVIRONMENTS=[
  {id:'blood',n:'血月',g:'傷害與生命',d:'持續2回合：攻擊傷害+2，治療量減少30%。'},
  {id:'spring',n:'生命之泉',g:'傷害與生命',d:'全場存活角色立即回血5，包含後備。'},
  {id:'quake',n:'地脈震動',g:'傷害與生命',d:'全場存活角色立即獲得3護盾，包含後備。'},
  {id:'sun',n:'烈日',g:'傷害與生命',d:'下回合開始，全場存活角色含後備受到3固定傷害。'},
  {id:'commune',n:'共產',g:'傷害與生命',d:'下回合開始，全場生命平均分配；不超過上限，不算治療。'},
  {id:'thorns',n:'荊棘叢生',g:'傷害與生命',d:'本回合受攻擊而失去生命時，攻擊者失去2生命；不連鎖反傷。'},
  {id:'peace',n:'和平鐘聲',g:'傷害與生命',d:'本回合黑牌傷害−4，最低0；反擊與獨立技能照常。'},
  {id:'kindness',n:'善意',g:'傷害與生命',d:'本回合回血時，敵方出戰角色也回復一半；分享不再連鎖。'},
  {id:'blessing',n:'弱者的祝福',g:'傷害與生命',d:'生命最少的存活玩家回血5，出戰角色本回合強壯+2；並列都生效。'},
  {id:'price',n:'強者的代價',g:'傷害與生命',d:'生命最高的存活角色含後備失去5生命，本回合虛弱+2。'},
  {id:'supply',n:'補給空投',g:'手牌與出牌',d:'每人下次使用「我牌太爛啦！」少扣5生命，最低0。'},
  {id:'fate',n:'命運',g:'手牌與出牌',d:'本回合隨機一種花色，最終點數+5。'},
  {id:'allIn',n:'孤注一擲',g:'手牌與出牌',d:'10點以上牌的點數×1.5；使用者回合末直接失去5生命。'},
  {id:'fallenCrown',n:'王權殞落',g:'手牌與出牌',d:'手中的J／Q／K變為同花色3／2／A，保留至使用。'},
  {id:'uprising',n:'小人物的逆襲',g:'手牌與出牌',d:'手中的A／2／3變為同花色K／Q／J，保留至使用。'},
  {id:'confusion',n:'混亂',g:'手牌與出牌',d:'結算時隨機更換出牌花色，點數不變。'},
  {id:'unity',n:'萬物歸一',g:'手牌與出牌',d:'每人各抽一個5～9點，整手牌改為該點數，花色不變。'},
  {id:'colorShift',n:'色彩流轉',g:'手牌與出牌',d:'手牌花色依序轉換：♠→♥→♣→♦→♠，點數不變。'},
  {id:'chaos',n:'混沌',g:'二十五之刻',d:'各玩家的二十五之刻隨機加減1～10；最低0，超過25會崩壞。'},
  {id:'duel',n:'決鬥之時',g:'二十五之刻',d:'存活且未使用絕技的玩家直接到25；多人達成則爭奪資格。'},
  {id:'resonance',n:'臨界共鳴',g:'二十五之刻',d:'存活玩家的二十五之刻設為24，並解除崩壞。'},
  {id:'trade',n:'命運交易',g:'二十五之刻',d:'出牌前可花1～5生命，換取等量二十五之刻；也可不交易。'},
  {id:'secondChance',n:'二次機會',g:'二十五之刻',d:'未用過絕技的玩家歸零並解除崩壞，再次開放完美決鬥資格。'},
  {id:'silence',n:'沉默',g:'特殊環境',d:'本回合只保留基本花色與環境效果；角色技能、附加狀態及絕技暫停。'},
  {id:'blueSmoke',n:'青煙',g:'特殊環境',d:'摩西絕技：5回合末出戰雙方各受5傷害；施放者被抽機率−30個百分點。'},
  {id:'mirrorResonance',n:'鏡像共鳴',g:'手牌與出牌',d:'本回合雙方結算花色相同，結算後各獲得3點護盾，保留至被消耗。'},
  {id:'assassin',n:'刺客',g:'手牌與出牌',d:'本回合J、Q、K點數+5；若對手出原始點數A、2、3，自己的最終點數歸零，優先於固定點數。'},
  {id:'invertedStage',n:'倒錯舞台',g:'手牌與出牌',d:'持續兩回合；揭牌後交換雙方出牌花色，保留原始點數，再依交換後花色結算。'},
  {id:'ultimatum',n:'最後通牒',g:'手牌與出牌',d:'每位存活玩家最高點數的一張手牌被公開標記；同點數只隨機選一張。兩次自己出戰內未打出該牌，直接失去4生命並解除標記。'},
  {id:'bomb',n:'炸彈!!',g:'傷害與生命',d:'隨機一位存活玩家的角色持有炸彈；持有者出戰才倒數，後備及旁觀暫停，5次出戰後造成15點固定傷害。「傳遞炸彈」用炸彈圖標取代出牌，不耗手牌；對手出♦或♥便接收炸彈，黑牌則失敗。倒數不重置。'},
  {id:'crisis',n:'危機就是轉機',g:'二十五之刻',d:'抽選權重為一般事件的1/10。生命最低的存活玩家直接啟用該角色兩種25絕技；並列隨機一人。本局有人用過25絕技後不再出現。'},
  {id:'woundCrystal',n:'傷口結晶',g:'傷害與生命',d:'本回合每次實際受傷後獲得等量護盾，單次最多5點；盾保留至被消耗。'},
  {id:'emergency',n:'急救運轉',g:'傷害與生命',d:'本回合治療改成等量護盾，仍受減療與禁療，紅心仍可被梅花斷補；護盾保留至被消耗。'},
  {id:'handRecycle',n:'手牌回收',g:'手牌與出牌',d:'本回合打出的牌返回手牌，不補新牌，保留明暗狀態；被技能銷毀的牌與卡牌槽仍消失。向日葵暫時手牌保留原消失期限。'},
  {id:'prisoner',n:'囚徒協議',g:'傷害與生命',d:'出牌前雙方秘密選擇合作或背叛，再同時揭曉；雙方合作各回4血，一人背叛時背叛者得4盾、合作者失去3血，雙方背叛各失去3血。'},
  {id:'publicTrade',n:'公開交易',g:'手牌與出牌',d:'所有存活玩家公開手中的全部暗牌，每公開一張回3血；已公開牌不重複回血，遵守治療限制。'},
  {id:'cheer',n:'上阿上阿我的朋友!',g:'特殊環境',d:'僅三人戰。本回合旁觀者改支持一名出戰者，給予本回合強壯5；被支持者造成攻擊傷害（含護盾）時，自己與支持者各得5盾，否則各失去5血。'},
  {id:'bloodAdvance',n:'預支血量',g:'傷害與生命',d:'各存活玩家可選擇支付5血，接下來自己出戰3次後回10血，遵守治療限制；旁觀與立即技能不倒數，換人保留期限。'},
  {id:'frenzy',n:'發瘋啦!!',g:'二十五之刻',d:'抽選權重為一般事件的1/10，僅本局無人發動過25絕技時出現。全體存活玩家立即啟用目前角色兩種25絕技，金光與橘紅粒子等同危機就是轉機。'},
  {id:'skyfall',n:'天降事件',g:'特殊環境',d:'隨機觸發3個不同且符合當前條件的場地事件，不會抽到天降事件本身。各事件保留原效果與持續時間，出牌前選擇依序處理。'}
];
const RULE_GUNS=[
  ['制式手槍','免費','虛弱2；沒有槍時自動取得。'],['鬼魅','400','無額外效果。'],['短管','300','虛弱1；基本點數小於5時+2。'],['神射','700','虛弱2；黑牌點數+5。'],['惡靈','1500','基本點數小於4的牌觸發3次。'],['判官','1300','反擊傷害×2。'],['捍衛者','1600','強壯1；梅花斷補成功追加5傷害。'],['幻象','2000','強壯3。'],['暴徒','2000','強壯2；黑牌點數+2。'],['奧丁','2000','強壯1；效果基本值1，依牌面點數多次觸發。'],['警長','1000','基本點數7或8時，點數×2。'],['間諜','4000','強壯10；不能持有槍護盾。']
];
const pages={
basic:()=>intro('基本規則','先看目標、花色，再看二十五之刻。')+`<div class="callout"><p><b>讓對手所有可上場的角色倒下，就是勝利。</b><br>每回合雙方各選1張牌，同時揭曉、結算，再補牌。</p></div><div class="cards">${card('<span class="suit">♠</span>黑桃','依點數攻擊。雙方都出黑桃時，小點數先出手；先倒下的人不能再攻擊。')}${card('<span class="suit">♣</span>梅花','傷害為點數的一半，向上取整；同時阻止對手本回合回血。')}${card('<span class="suit red">♥</span>紅心','依點數回血，最多補到生命上限；被梅花斷補時失效。')}${card('<span class="suit red">♦</span>方塊','擋住普通攻擊，並依方塊點數反擊；沒有攻擊可擋時不造成傷害。')}</div><h2>一回合怎麼走</h2><div class="panel"><ol class="steps"><li>選牌前可使用可用的技能。</li><li>雙方出牌，先判斷斷補，再結算黑桃、梅花、回血。</li><li>結算回合末效果，補牌並進入下一回合。</li></ol><p class="muted" style="margin-top:16px">例如：♠7遇到♦4，黑桃被擋住，攻擊者受到4點反擊。</p></div><h2>二十五之刻</h2><div class="panel"><p>黑桃命中、梅花斷補、方塊反擊成功：累積牌面基本點數。紅心：累積實際回復的生命。</p><p><b>剛好25點</b>取得完美決鬥資格，下回合可選一個25絕技；超過25點會崩壞。</p><p>多人同時達成：公告5秒 → 點擊爭奪5秒 → 輪盤決定唯一使用者。已使用者不能再次發動。</p></div><h2>先記住這三件事</h2><div class="panel"><ul><li>A＝1、J＝11、Q＝12、K＝13；黑牌指黑桃與梅花。</li><li>連續兩次出方塊卻沒反擊成功，下次不能出方塊。</li><li>「我牌太爛啦！」會重抽手牌並結束回合，依次扣5、10、15…生命。</li></ul></div>`,
modes:()=>intro('對戰模式','先選人數，再決定是否使用角色與公開手牌。')+`<div class="cards">${card('兩人戰','每回合兩人直接對決，擊倒對手即獲勝。')}${card('三人戰','輪到的玩家依其他玩家血量比例抽對手，第三人旁觀。最後存活者獲勝。')}${card('3v3角色戰','兩位玩家各帶一隊。角色倒下換後備，先擊敗對方所有可上場角色獲勝。')}${card('Boss挑戰賽','兩名挑戰者輪流對抗Boss；Boss倒下則挑戰者勝，兩位挑戰者都倒下則Boss勝。')}</div><h2>手牌與換人</h2><div class="cards">${card('明牌／暗牌','明牌模式公開部分手牌；暗牌模式只看得到自己的手牌。')}${card('3v3換人','先禁用再選角，每人有2次手動換人；下一回合換上。植物固定後備。')}${card('旁觀猜點','猜中可回1血，或對較大者造成1傷害。雙方點數相同且有猜，自己損失5血。')}${card('出牌限時','一般限時到會自動隨機出牌；時間殺人魔的5秒死線則會直接死亡。')}</div>`,
characters:()=>intro('角色','先看核心玩法，再展開想用的角色技能與絕技。')+`<div class="toolbar"><input id="characterSearch" type="search" aria-label="搜尋角色" placeholder="搜尋角色或技能" oninput="filterCharacters()"><select id="characterFaction" aria-label="角色陣營" onchange="filterCharacters()"><option value="all">全部陣營</option>${Object.entries(factionNames).map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select></div><div id="characterList"></div>`,
factions:()=>intro('陣營','角色的個別技能之外，還會受到所屬陣營的規則影響。')+`<div class="cards">${card('Limbus','理智範圍−45～45，影響傷害。理智−45會侵蝕：自動出牌且可能反噬，下回合回到0理智。')}${card('PVZ','只能在3v3使用，每隊最多2株後備植物；植物不能上場，提供代受、護盾或手牌支援。')}${card('軌跡','隊伍共用CP，上限200。造成傷害+15CP，受傷+10CP；戰技下回合生效，S技立即生效。')}${card('Valorant','每回合先進商店，買槍、護盾與技能。第一回合經濟500，後續依上一回合表現發放。')}</div><h2>Limbus：理智怎麼變</h2><div class="panel"><ul><li>出牌點數較大：+5；較小：−5。</li><li>反擊成功：+10；被反擊：−10；擊殺敵人：+15。</li><li>正理智可能增傷，負理智可能減傷；45理智固定傷害+2。</li><li>3v3換人繼承理智；倒下換人時，負理智重置為0。</li></ul></div><h2>Valorant：下一回合收入</h2><div class="table-wrap"><table><thead><tr><th>上一回合表現</th><th>收入</th></tr></thead><tbody><tr><td>單方面攻擊或反擊成功</td><td>1000</td></tr><tr><td>雙方互攻或雙方回血</td><td>800</td></tr><tr><td>被斷補或單方面攻擊</td><td>400，連續每回合+200，最高1000</td></tr><tr><td>其他結果</td><td>500</td></tr></tbody></table></div>`,
environment:()=>intro('環境','房主可開關隨機環境；開啟後每3～5回合發生一項，不連續重複。')+`<div class="callout"><p>多數環境涵蓋全場存活角色，包含後備；不會復活已倒下的人。以事件標示的生效時間為準。</p></div><div class="toolbar"><label for="environmentGroup">效果分類</label><select id="environmentGroup" onchange="filterEnvironments()"><option value="all">全部環境</option>${['傷害與生命','手牌與出牌','二十五之刻','特殊環境'].map(n=>`<option>${n}</option>`).join('')}</select></div><div id="environmentList"></div>`,
equipment:()=>intro('裝備','Valorant玩家先買完、按「確定裝備」，才開始本回合。')+`<div class="callout"><p>只能裝備一把槍，新槍覆蓋舊槍。受到黑桃、梅花或方塊的實際傷害會掉槍；下回合沒槍時補制式手槍。</p></div><div class="table-wrap"><table><thead><tr><th>槍械</th><th>價格</th><th>效果</th></tr></thead><tbody>${RULE_GUNS.map(g=>`<tr>${g.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h2>護盾與多次觸發</h2><div class="panel"><ul><li>槍護盾1000：保住一次受擊的槍，不減少生命傷害，不可疊加。</li><li>多次觸發逐次計算強壯、虛弱、守護與易損；對方只反擊一次。</li><li>奧丁1～6點觸發同點數次；7～13點依序觸發6、7、7、8、8、9、9次。</li></ul></div><h2>離索可購買的技能</h2><div class="cards">${card('雙源 · 1100','擋一次傷害；互攻後最多刷新一次，不可疊加。')}${card('削減 · 900','敵人本回合受到的傷害×1.5。')}${card('應變 · 900','雙方本回合黑牌主攻傷害固定0，反擊與追擊照常。')}</div><p class="muted" style="margin-top:14px">每個技能最多存1次，出牌前使用。</p>`,
status:()=>intro('狀態與名詞','看清楚是改「點數」、改「受傷」，還是限制行動。')+`<div class="cards">${card('強壯／虛弱','每層強壯：出牌點數+1。每層虛弱：出牌點數−1。')}${card('守護／易損','每層守護：受到傷害−1。每層易損：受到傷害+1。')}${card('護盾','先承受整次傷害，溢出不扣生命。扣到護盾也算命中。')}${card('大地之牆','抵擋一次傷害，包含斬殺；只剩一人也不會翻倍。')}${card('炎傷／流血','炎傷：回合末依層數受傷，之後−1層。流血：使用黑牌時依層數受傷，之後−1層。')}${card('暈眩／技能封鎖','暈眩：不能出牌與行動。技能封鎖：主動與被動暫時失效。')}${card('毅力／斬殺','毅力擋一般致命傷害並保留1血；通常不能擋斬殺，個別角色例外。')}${card('群體／廣域亂射','群體：攻擊敵方全體，通常含後備。廣域亂射：每一擊重新隨機選目標。')}</div><h2>傷害怎麼算</h2><div class="panel"><p>先算牌點數與倍率，再套用強壯、虛弱，以及受擊方的守護、易損與防護。</p><p class="muted">多個點數倍率加成相加：+50%與+70%合計+120%。固定傷害、斬殺與個別技能依各自說明。</p></div><h2>回合中使用技能</h2><div class="panel"><p>若立即技能改變這一回合的效果，對手已出的牌會退回，讓對手重新選牌。</p><p>狀態依標示的回合數結束；部分狀態只在角色或隊伍實際參戰後扣回合。</p></div>`
};
function filterCharacters(){
  const query=document.getElementById('characterSearch').value.trim().toLocaleLowerCase(),faction=document.getElementById('characterFaction').value;
  const list=RULE_CHARACTERS.filter(c=>(faction==='all'||c.f===faction)&&JSON.stringify([c.n,c.tag,c.d,c.u,c.more]).toLocaleLowerCase().includes(query));
  document.getElementById('characterList').innerHTML=`<p class="count" role="status">${list.length} 位角色</p><div class="cards">${list.map(c=>`<article class="card character"><span class="label">${factionNames[c.f]}${c.tag?' · '+esc(c.tag):''}</span><h3>${esc(c.n)}</h3><p>${esc(c.d)}</p>${c.u.length||c.more?`<details><summary>技能與絕技</summary>${c.more?`<p>${esc(c.more)}</p>`:''}${c.u.map(u=>`<p><b>${esc(u[0])}</b>${esc(u[1])}</p>`).join('')}</details>`:''}</article>`).join('')}</div>${list.length?'':'<p class="empty">找不到符合的角色，試試其他名稱或陣營。</p>'}`;
}
function filterEnvironments(){const group=document.getElementById('environmentGroup').value,list=RULE_ENVIRONMENTS.filter(e=>group==='all'||e.g===group);document.getElementById('environmentList').innerHTML=`<div class="cards">${list.map(e=>card(esc(e.n),esc(e.d),e.g)).join('')}</div>`}
function renderRules(focus=false){
  const key=location.hash.slice(1),page=Object.hasOwn(pages,key)?key:'basic';
  document.querySelectorAll('.rule-nav a').forEach(a=>{if(a.hash==='#'+page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  document.getElementById('content').innerHTML=pages[page]()+`<footer class="footer">只需要查一項規則？從左側或上方切換分類即可。</footer>`;
  if(page==='characters')filterCharacters();if(page==='environment')filterEnvironments();
  document.title=document.getElementById('pageTitle').textContent+'｜決鬥25點規則';
  if(focus){document.getElementById('pageTitle').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'})}
}
window.addEventListener('hashchange',()=>renderRules(true));renderRules();
</script>
</body>
